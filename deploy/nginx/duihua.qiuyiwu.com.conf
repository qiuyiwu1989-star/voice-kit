# duihua.qiuyiwu.com —— 语音中台测试环境（2026-09-17 改指 127.0.0.1:8030 voicekit-staging；8020 是准备切正式的 voicekit-svc）
# 反代 → uvicorn 127.0.0.1:8020（systemd voicekit-svc）。同机的 TeamClaws / ceoagent 站点互不相干。
server {
    listen 80; listen [::]:80;
    server_name duihua.qiuyiwu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html; allow all; default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name duihua.qiuyiwu.com;

    ssl_certificate     /etc/letsencrypt/live/duihua.qiuyiwu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duihua.qiuyiwu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 音频上传（ASR）会比较大
    client_max_body_size 25M;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 必须关缓冲，否则流式对话会被憋成一次性返回
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
