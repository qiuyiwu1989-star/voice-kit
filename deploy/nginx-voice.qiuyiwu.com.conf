# voice.qiuyiwu.com —— voice-kit 公共语音服务（多租户）
# 反代 → uvicorn 127.0.0.1:8020（systemd voicekit-svc）
#
# 跟球球老师生产（8000）、跟联调探针（8010）都是独立进程独立端口。
# 这里挂了不影响球球老师；球球老师部署也不碰这里。

server {
    listen 80; listen [::]:80;
    server_name voice.qiuyiwu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html; allow all; default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name voice.qiuyiwu.com;

    ssl_certificate     /etc/letsencrypt/live/voice.qiuyiwu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.qiuyiwu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 音频上传（ASR）会比较大
    client_max_body_size 25M;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 必须关缓冲，否则流式对话会被憋成一次性返回
        proxy_buffering off;
        # LLM 首字 ~1.5s，但报告类长请求可能几十秒，给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 这是纯 API，不是网站：不需要 CSP/frame 那套，
    # 但要挡住被人当页面嵌进去。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
