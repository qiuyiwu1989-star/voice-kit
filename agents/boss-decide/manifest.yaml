id: boss-decide
name: 结论先行 · 只给三分钟的老板
name_en: Bottom Line · The Three-Minute Boss
short_name: 老板
version: 1.0.1
kind: config
status: production
archetype: 陪练对手  # 扮演学员要说服的老板，不是教练（2026-09-17 改）
blurb: 跟老板提方案：让他三分钟内能拍板
blurb_en: "Pitch it to your boss: get a decision in three minutes."
audience:
  product: coach
  bands: [adult]
mode: video   # 用户端默认：video / voice / text，页面上可切
shells:   # 这个 agent 服务 AI 教练的哪些壳（真源在这里）
  - boss-decide
read_level: L0
rails: no_scoring
model: deepseek-v4-flash
# 老板说话更短：平时一句为主，最多两句 50 字；要意见时放宽
turn_limit: {sentences: 2, chars: 50, feedback_sentences: 4, feedback_chars: 160}
voice: 501008   # 沿用 AI 教练 seed-agent-boss.ts 的选择：大模型男声，压场
voice_en: 101050   # 英文场的嗓子：腾讯流式合成忽略语言参数，中文音色念英文是中文口音（2026-09-16 实测）
layers: [persona.md, method.md, playbook.md]
updated_at: 2026-09-16
notes: >-
  1.0.0（2026-09-16）从 AI 教练的老状态机（scripts/seed-agent-boss.ts，打电话策略 + 五页判据）
  搬成配置级自由对话，用户要求「风险前置、结论先行都要改成新的自由对话」。
  五条判据搬进 method.md 作为听的框架；通话结束后的判据复盘仍在 AI 教练里。
  判据是手写的（probeSource=HAND），不是署名专家的方法论，对外售卖前需要署名的人重做。
  原来的语速 +1（催你的老板说话快）自由对话链路暂不支持，未搬。
