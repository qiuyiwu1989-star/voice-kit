id: red-coach
name: RED 融资叙事教练
version: 1.0.0
kind: code
status: production
archetype: 教练
audience:
  product: coach
  bands: [adult]
mode: voice   # 用户端默认：video / voice / text，页面上可切
shells:   # 这个 agent 服务 AI 教练的哪些壳（真源在这里，REP 不加列不迁移）
  - founder-pitch
  - sarah-chen
read_level: L0
rails: no_scoring
voice: coach
layers: [persona.md, method.md, playbook.md]
upstream:
  # REP 自己的四段状态机（orchestrate）。同一台机器，走 127.0.0.1 不绕公网。
  # 会话身份靠 X-Session-Id（= takeId）转过去，见 REP 的 /api/agent/red/chat。
  url: http://127.0.0.1:3004/api/agent/red/chat
  key_env: REP_AGENT_KEY
# 从通用对话页点它时，带人去这里练（它的大脑在 AI 教练里，没有那边的一场就没法工作）
entry: https://jiaolian.qiuyiwu.com/s/founder-pitch/talk?v=2
companion: listener     # 通话中在场的是听众，教练在复盘后开口
notes: 方法论在 AI 教练的 MethodPage/Criterion 表里（nine.ts 是 seed），这里是摘要。
