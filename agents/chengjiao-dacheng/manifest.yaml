notes: 客户沟通三件套之三。场景：客户已经比过几家，要个判断。方法论 Challenger，先给观点再定制，敢说不。和阿询是刻意的对照组。
model_note: 2026-09-14 定 deepseek-v4-flash：服务器实测 6/6 首字 1.0–1.2s；glm-5.2 同批 6 次里 2.9s 和 7.0s 各一次。语音看尾部不看平均。
# 0.2.0（2026-09-17 交付前体检）：① 方法论/策略里的示例句（五年级数学、读题跳字、周三换老师）被模型当成对方的真实情况照搬——家长问编程课，大成说「您孩子五年级读题跳字」。加「只用对方说过的信息」一节，示例句标明是示例。② 一开口七八十字，加 turn_limit。
