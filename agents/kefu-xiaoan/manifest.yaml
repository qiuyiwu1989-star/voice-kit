turn_limit: {sentences: 2, chars: 60, feedback_sentences: 4, feedback_chars: 160}
rails: adult_basic
voice: 603004   # 温柔小柠（女·超自然·聊天）——客服要软
voice_en: 101051   # 英文场的嗓子：腾讯流式合成忽略语言参数，中文音色念英文是中文口音（2026-09-16 实测）
layers: [persona.md, method.md, playbook.md]
notes: 客户沟通三件套之一。场景：客户带着不满来。方法论 HEARD，先情绪后事实。2026-09-14 用户要亲自测。
model_note: 2026-09-14 定 deepseek-v4-flash：服务器实测 6/6 首字 1.0–1.2s；glm-5.2 同批 6 次里 2.9s 和 7.0s 各一次。语音看尾部不看平均。
# 0.2.0（2026-09-17 交付前体检）：① 方法论/策略里的示例句（五年级数学、读题跳字、周三换老师）被模型当成对方的真实情况照搬——家长问编程课，大成说「您孩子五年级读题跳字」。加「只用对方说过的信息」一节，示例句标明是示例。② 一开口七八十字，加 turn_limit。
