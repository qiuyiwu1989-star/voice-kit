<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户记忆 · voice-kit 后台</title>
<link rel="stylesheet" href="/admin/static/vk-admin.css?v={{VK_ASSET_V}}">
<script src="/admin/static/vk-shell.js?v={{VK_ASSET_V}}"></script>
</head>
<body data-vk-module="memory" data-vk-env="{{VK_ENV}}">
<div class="vk-shell" id="vkShell">
  <div class="vk-workspace" id="main" data-pane="list">
    <aside class="vk-list" aria-label="用户列表">
      <div class="vk-list-head"><span class="vk-list-title">用户</span><span class="hint" id="listCount"></span></div>
      <div class="vk-list-body" id="list"><span class="vk-skel"></span><span class="vk-skel w60"></span><span class="vk-skel"></span><span class="vk-skel w40"></span></div>
      <div class="vk-list-foot"><p class="hint">记忆按产品分开存：<code>users/&lt;产品&gt;/&lt;uid&gt;/</code>。uid 目前是用户自报的名字，不是登录身份。每次改、删、导出都会写审计。</p></div>
    </aside>
    <main class="vk-detail" id="detailScroll" tabindex="-1">
      <div class="vk-detail-in" id="detail"><div class="vk-empty">选一个用户。</div></div>
    </main>
  </div>
</div>

<script>
VK.build();
const API = '/admin/memory/api';
const api = VK.api(API);
const esc = VK.esc, icon = VK.icon, enc = encodeURIComponent, toast = VK.toast;
let META = null, PRODUCT = 'talk', USERS = [], CUR = null, TAB = 'facts', EDIT = null, QUERY = '';
const $ = s => document.querySelector(s);
const when = s => esc(VK.when(s));
const full = s => esc(String(s||'').replace('T',' ').slice(0,19));
const userPath = () => '/users/'+enc(CUR.summary.product)+'/'+enc(CUR.summary.uid);
const readonlyProduct = p => !!(META && META.readonly.includes(p));
function loadLegacyProduct(){ try{ return localStorage.getItem('vk_mem_product'); }catch(e){ return null; } }
function setUrlUid(uid){ try{ const u = new URL(location.href); if(uid) u.searchParams.set('uid', uid); else u.searchParams.delete('uid'); history.replaceState(null,'',u.pathname+u.search); }catch(e){} }

// ---------------------------------------------------------------- 列表
async function loadList(){
  const d = await api('/users?product='+enc(PRODUCT)); USERS = d.users;
  paintList();
}
function paintList(){
  const q = QUERY.toLowerCase();
  const shown = USERS.filter(u => !q || String(u.uid).toLowerCase().includes(q));
  $('#listCount').textContent = USERS.length ? (q ? shown.length+' / '+USERS.length : USERS.length+' 个') : '';
  const ro = readonlyProduct(PRODUCT);
  $('#list').innerHTML = (ro ? `<div class="vk-alert vk-alert--child">${icon('shield')}<div><b>儿童数据 · 只读</b></div></div>` : '') +
    (shown.length ? shown.map(u => `<button class="vk-item" data-uid="${esc(u.uid)}" ${CUR&&CUR.summary.uid===u.uid&&CUR.summary.product===PRODUCT?'aria-current="true"':''}>
      <span class="l1"><span class="nm mono">${esc(u.uid)}</span>${u.legacy?'<span class="vk-tag">旧目录</span>':''}<span class="hint">${when(u.last_at)}</span></span>
      <span class="l2"><span>${u.sessions} 场</span><span class="vk-dot-sep"></span><span>${u.facts} 条事实</span>${(u.agents||[]).length?`<span class="vk-dot-sep"></span><span>${u.agents.map(esc).join('、')}</span>`:''}</span></button>`).join('')
    : `<div class="vk-empty">${icon('empty')}${USERS.length?`当前筛选下没有匹配「${esc(QUERY)}」的用户。`:'这个产品下还没有用户记忆。'}</div>`);
  document.querySelectorAll('#list .vk-item').forEach(b => b.onclick = () => openUser(b.dataset.uid, {focus:true}));
}

async function openUser(uid, opt={}){
  try{
    const keepTab = opt.keepTab && CUR && CUR.summary.uid === uid;
    CUR = await api('/users/'+enc(PRODUCT)+'/'+enc(uid));
    if(!keepTab){ TAB = 'facts'; EDIT = null; }
    render(); paintList(); setUrlUid(uid); VK.crumb(uid); VK.showDetail();
    if(opt.focus) $('#detailScroll').focus({preventScroll:true});
  }catch(e){ toast('打不开：'+e.message, {kind:'err'}); }
}

// ---------------------------------------------------------------- 详情
// userHtml / panelHtml 是纯函数：给数据出 HTML。儿童产品（readonly）时改、删、导出、删用户
// 一个都不渲染——不是置灰（规范 §5 R5）。tests/test_admin_shell.py 直接调它们断言。
const TABS = [['facts','事实'],['judgments','判断'],['sessions','对话'],['reviews','复盘'],['audit','审计'],['overview','概览']];
function tabCount(a, t){
  if(t==='facts') return a.facts.length;
  if(t==='judgments') return Object.values(a.judgments||{}).reduce((s,x)=>s+x.length,0);
  if(t==='sessions') return a.sessions.length;
  if(t==='reviews') return a.reviews.length;
  if(t==='audit') return a.audit.length;
  return null;
}
function userHtml(a, tab){
  const s = a.summary, ro = !!a.readonly;
  return `
  <div class="vk-obj-head">
    <div class="id">
      <div class="vk-obj-title"><h1 class="mono">${esc(s.uid)}</h1>
        ${ro?`<span class="vk-badge vk-badge--child">${icon('shield')}儿童数据</span><span class="vk-badge vk-badge--ro">${icon('lock')}只读</span>`:''}
        ${s.legacy?'<span class="vk-tag">还在旧目录</span>':''}</div>
      <div class="vk-obj-meta"><span class="vk-tag mono">${esc(s.product)}</span><span>最近活跃 ${when(s.last_at)}</span><span class="vk-dot-sep"></span><span>${s.sessions} 场对话</span><span class="vk-dot-sep"></span><span>用过 ${(s.agents||[]).map(esc).join('、')||'—'}</span></div>
    </div>
    ${ro?'':`<div class="vk-obj-actions vk-desk-only"><button class="vk-btn" id="btnExport">${icon('export')}导出记忆 JSON</button></div>`}
  </div>
  ${ro?`<div class="vk-alert vk-alert--child" role="note">${icon('shield')}<div><b>儿童数据 · 只读</b>　修改流程还没定，这里只能看，不能改、删、导出。</div></div>`:''}
  ${s.legacy?`<div class="vk-alert vk-alert--info">${icon('info')}<div>这个用户还在旧目录 <code>users/${esc(s.uid)}/</code>，第一次写入时会自动挪进 <code>talk</code>。</div></div>`:''}
  <div class="vk-tabs" role="tablist" aria-label="记忆分区">${TABS.map(([k,l]) => { const n = tabCount(a,k);
    return `<button class="vk-tab" role="tab" id="tab-${k}" aria-controls="panel" data-tab="${k}" aria-selected="${tab===k}" tabindex="${tab===k?0:-1}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`; }).join('')}</div>
  <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${panelHtml(a, tab)}</div>`;
}
function panelHtml(a, tab){
  const ro = !!a.readonly;
  if(tab==='facts'){
    const facts = a.facts, cats = (META && META.fact_categories) || a.fact_categories || [];
    return `<p class="hint" style="margin-bottom:12px">事实只有一份、agent 中立：由平台采样写入，任何 agent 不能直接写，所有 agent 读同一份。${ro?'':'这里的修改会进审计。'}</p>
    ${facts.length?`<div class="vk-tw"><table class="vk-table"><thead><tr><th>类别</th><th>内容</th><th style="min-width:7em">原话</th><th class="r">次数</th><th>首次 / 最近</th>${ro?'':'<th class="vk-desk-only"><span class="vk-sr">操作</span></th>'}</tr></thead><tbody>
    ${facts.map(f => EDIT===f.index && !ro ? `<tr class="editing" data-i="${f.index}">
      <td><label class="vk-sr" for="efCat">类别</label><select class="vk-select-native vk-input--sm" id="efCat">${cats.map(c=>`<option ${c===f.category?'selected':''}>${esc(c)}</option>`).join('')}</select></td>
      <td colspan="3"><label class="vk-sr" for="efContent">内容</label><input class="vk-input vk-input--sm" id="efContent" style="width:100%" value="${esc(f.content)}"></td>
      <td colspan="2" class="act"><button class="vk-btn vk-btn--sm vk-btn--primary" data-act="save-fact" title="Enter 保存">保存</button> <button class="vk-btn vk-btn--sm" data-act="cancel-fact" title="Esc 取消">取消</button></td></tr>`
    : `<tr data-i="${f.index}"><td class="mono nowrap">${esc(f.category)}</td><td>${esc(f.content)}${f.edited_at?' <span class="vk-tag">后台改过</span>':''}</td>
      <td class="hint">${esc(f.quote||'')}</td><td class="r num">${f.seen||1}</td><td class="mono nowrap hint">${esc(f.first_at||'')} / ${esc(f.last_at||'')}</td>
      ${ro?'':`<td class="act vk-desk-only"><button class="vk-btn vk-btn--ghost vk-btn--sm" data-act="edit-fact" data-i="${f.index}">改</button><button class="vk-btn vk-btn--ghost vk-btn--sm vk-btn--icon" data-act="fact-more" data-i="${f.index}" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作">${icon('more')}</button></td>`}</tr>`).join('')}
    </tbody></table></div>`:`<div class="vk-empty">${icon('empty')}还没有事实。平台从对话里抽到之后会出现在这里。</div>`}`;
  }
  if(tab==='judgments'){
    const js = a.judgments||{};
    return `<p class="hint" style="margin-bottom:12px">判断是某个 agent 用自己的方法论读同一批事实，按 agent 分片、互不覆盖。<b>不改只删</b>——改写等于替它伪造读法。</p>
    ${Object.keys(js).length?Object.entries(js).map(([aid,arr]) => `<div class="vk-section" style="margin-top:16px"><h3><span class="mono">${esc(aid)}</span><span class="hint">${arr.length} 条</span></h3>
      ${arr.map((j,i)=>({j,i})).reverse().map(({j,i}) => `<div class="vk-card"><div class="vk-row"><span class="hint mono">${full(j.at)} · 场次 ${esc(j.session_id||'')}</span><span class="grow"></span>
        ${ro?'':`<button class="vk-btn vk-btn--ghost vk-btn--sm vk-btn--icon vk-desk-only" data-act="judg-more" data-a="${esc(aid)}" data-i="${i}" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作">${icon('more')}</button>`}</div>
        <div class="pre" style="margin-top:6px">${esc(j.text)}</div></div>`).join('')}</div>`).join('')
      :`<div class="vk-empty">${icon('empty')}还没有判断。</div>`}`;
  }
  if(tab==='sessions'){
    return a.sessions.length?`<div class="vk-tw"><table class="vk-table"><thead><tr><th>时间</th><th>agent</th><th class="r">来回</th><th>开头</th><th><span class="vk-sr">操作</span></th></tr></thead><tbody>
      ${a.sessions.map(x => `<tr><td class="mono nowrap" title="${full(x.at)}">${when(x.at)}</td><td>${esc(x.agent_name||x.agent)}</td><td class="r num">${x.user_turns}</td><td>${esc(x.opening)}</td>
        <td class="act"><button class="vk-btn vk-btn--ghost vk-btn--sm" data-act="open-session" data-file="${esc(x.file)}" aria-expanded="false">看逐句</button></td></tr>
        <tr class="sub" hidden data-sub="${esc(x.file)}"><td colspan="5"></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="vk-empty">${icon('empty')}还没有对话记录。</div>`;
  }
  if(tab==='reviews'){
    return a.reviews.length?a.reviews.map(r => `<div class="vk-card"><div class="hint mono">${full(r.at)} · ${esc(r.method_label||r.method)}${r.agent?' · '+esc(r.agent):''} · ${(r.session_ids||[]).length} 场</div><div class="pre" style="margin-top:6px">${esc(r.text)}</div></div>`).join('')
      :`<div class="vk-empty">${icon('empty')}还没有综合复盘。</div>`;
  }
  if(tab==='audit') return auditHtml(a.audit);
  const s = a.summary;
  return `<div class="vk-grid vk-g-4">
      <div class="vk-card vk-metric"><div class="kicker">Sessions · 对话</div><div class="big">${s.sessions}</div></div>
      <div class="vk-card vk-metric"><div class="kicker">Facts · 事实</div><div class="big">${s.facts}</div></div>
      <div class="vk-card vk-metric"><div class="kicker">Judgments · 判断</div><div class="big">${s.judgments}</div></div>
      <div class="vk-card vk-metric"><div class="kicker">Reviews · 复盘</div><div class="big">${s.reviews}</div></div></div>
    <p class="hint" style="margin-top:12px">最近活跃 ${full(s.last_at)} · 用过：${(s.agents||[]).map(esc).join('、')||'—'}</p>
    ${ro?'':`<div class="vk-danger-zone"><div class="txt"><h3>危险区</h3><p class="hint">删除这个用户在 <code>${esc(s.product)}</code> 下的全部记忆：对话、事实、各 agent 的判断、综合复盘。不能恢复，审计里只留条数。</p></div>
      <button class="vk-btn vk-btn--danger-outline vk-desk-only" id="btnDelUser">${icon('trash')}删除这个用户…</button>
      <p class="vk-mobile-note hint">删除请在电脑上操作。</p></div>`}`;
}
function auditHtml(au){
  if(!au.length) return `<div class="vk-empty">${icon('empty')}后台还没动过这个用户的记忆。</div>`;
  const WORD = {update_fact:'改了事实', delete_fact:'删了事实', delete_judgment:'删了判断', delete_user:'删除了用户', export:'导出了记忆'};
  const cls = x => /delete/.test(x.action) ? 'd' : /update|patch|edit/.test(x.action) ? 'w' : '';
  const v = o => o==null ? '' : typeof o === 'object' ? (o.content!=null ? (o.category?'['+o.category+'] ':'')+o.content : JSON.stringify(o)) : String(o);
  let day = '';
  return `<div class="vk-tl">${au.map(x => {
    const d = String(x.at||'').slice(0,10); const head = d!==day ? `<div class="vk-tl-day kicker">${esc(d)}</div>` : ''; day = d;
    return `${head}<div class="vk-tl-it ${cls(x)}"><div class="when">${esc(String(x.at||'').replace('T',' ').slice(11,19))}</div>
      <div class="what"><b>${esc(x.actor||'—')}</b> ${esc(WORD[x.action]||x.action)} <span class="mono hint">${esc(x.target||'')}</span></div>
      ${(x.before||x.after)?`<div class="chg">${x.before?`<s>${esc(v(x.before))}</s>`:''}${x.before&&x.after?' → ':''}${x.after?`<em>${esc(v(x.after))}</em>`:''}</div>`:''}</div>`;
  }).join('')}</div>`;
}

function render(){
  $('#detail').innerHTML = userHtml(CUR, TAB);
  bind();
}
function paintPanel(){
  $('#panel').innerHTML = panelHtml(CUR, TAB);
  $('#panel').setAttribute('aria-labelledby', 'tab-'+TAB);
  document.querySelectorAll('.vk-tab').forEach(t => { const on = t.dataset.tab===TAB; t.setAttribute('aria-selected', on); t.tabIndex = on?0:-1; });
  bindPanel();
}

// ---------------------------------------------------------------- 交互
function bind(){
  document.querySelectorAll('.vk-tab').forEach(t => t.onclick = () => { if(TAB!==t.dataset.tab){ TAB = t.dataset.tab; EDIT = null; paintPanel(); } });
  const ex = $('#btnExport');
  if(ex) ex.onclick = () => VK.busy(ex, async () => {
    const r = await fetch(API+userPath()+'/export');
    if(r.status===401) VK.unauthorized();
    if(!r.ok){ let d=''; try{d=(await r.json()).detail}catch(e){} throw new Error(d||('HTTP '+r.status)); }
    const blob = await r.blob(); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'memory-'+CUR.summary.product+'-'+CUR.summary.uid+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    await openUser(CUR.summary.uid, {keepTab:true}); toast('已导出（记进了审计）');
  }, '导出中…');
  bindPanel();
}
function bindPanel(){
  document.querySelectorAll('[data-act="open-session"]').forEach(b => b.onclick = async () => {
    const row = [...document.querySelectorAll('tr[data-sub]')].find(r => r.dataset.sub === b.dataset.file);
    if(!row.hidden){ row.hidden = true; b.setAttribute('aria-expanded','false'); b.textContent = '看逐句'; return; }
    try{
      const s = await api(userPath()+'/sessions/'+enc(b.dataset.file));
      const who = s.agent_name||s.agent;
      row.firstElementChild.innerHTML = `<div class="vk-conv">${(s.turns||[]).map(t => `<div class="vk-say ${t.role==='bot'?'agent':''}"><span class="who">${t.role==='bot'?esc(who):'用户'}</span><div class="bub">${esc(t.text)}<span class="t">${esc(t.t||'')}</span></div></div>`).join('')}</div>
        ${s.review?`<div class="vk-card" style="margin-top:12px"><div class="hint">该场回顾（${[who, s.version?'v'+s.version:'', s.model||''].filter(Boolean).map(esc).join(' · ')}）</div><div class="pre" style="margin-top:4px">${esc(s.review)}</div></div>`:''}`;
      row.hidden = false; b.setAttribute('aria-expanded','true'); b.textContent = '收起';
    }catch(e){ toast('读不出来：'+e.message, {kind:'err'}); }
  });
  if(CUR.readonly) return;             // 儿童产品：写操作一个都没渲染，这里也不绑定
  document.querySelectorAll('[data-act="edit-fact"]').forEach(b => b.onclick = () => { EDIT = +b.dataset.i; paintPanel(); const i = $('#efContent'); if(i){ i.focus(); i.select(); } });
  document.querySelectorAll('[data-act="fact-more"]').forEach(b => b.onclick = () => VK.menu(b, [
    {label:'删除这条事实…', icon:'trash', danger:true, onSelect: () => deleteFact(CUR.facts.find(f => f.index === +b.dataset.i))}]));
  const save = $('[data-act="save-fact"]');
  if(save){
    const f = CUR.facts.find(x => x.index === EDIT);
    const cancelEdit = () => { EDIT = null; paintPanel(); const b = document.querySelector(`[data-act="edit-fact"][data-i="${f.index}"]`); if(b) b.focus(); };
    const doSave = () => VK.busy(save, async () => {
      await api(userPath()+'/facts/'+f.index, {method:'PATCH', body: JSON.stringify({expect:{category:f.category, content:f.content},
        category: $('#efCat').value, content: $('#efContent').value})});
      EDIT = null;
      await openUser(CUR.summary.uid, {keepTab:true});
      const tr = document.querySelector(`tr[data-i="${f.index}"]`); if(tr) tr.classList.add('flash');
      toast('已改，审计已记录');
    }, '保存中…');
    save.onclick = doSave;
    $('[data-act="cancel-fact"]').onclick = cancelEdit;
    [$('#efContent'), $('#efCat')].forEach(el => el.onkeydown = e => {
      if(e.key==='Enter' && el.id==='efContent'){ e.preventDefault(); doSave(); }
      if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
    });
  }
  document.querySelectorAll('[data-act="judg-more"]').forEach(b => b.onclick = () => VK.menu(b, [
    {label:'删除这条判断…', icon:'trash', danger:true, onSelect: () => deleteJudgment(b.dataset.a, +b.dataset.i)}]));
  const du = $('#btnDelUser');
  if(du) du.onclick = deleteUser;
}

async function mutate(sub, opt, msg){
  try{ await api(userPath()+sub, opt); await openUser(CUR.summary.uid, {keepTab:true}); toast(msg); }
  catch(e){ toast('没成：'+e.message, {kind:'err'}); if(/变了/.test(e.message)) openUser(CUR.summary.uid, {keepTab:true}); }
}
async function deleteFact(f){
  if(!f) return;
  const ok = await VK.confirm({danger:true, title:'删除这条事实？', ok:'永久删除',
    body:`<ul><li>会删掉：<b>[${esc(f.category)}] ${esc(f.content)}</b>，所有 agent 下次都读不到。</li><li>不会动：对话原文、各 agent 已经写下的判断。</li><li>不能恢复；审计里留下删前的值。</li></ul>`});
  if(ok) await mutate('/facts/'+f.index, {method:'DELETE', body: JSON.stringify({expect:{category:f.category, content:f.content}})}, '已删，审计已记录');
}
async function deleteJudgment(aid, i){
  const j = CUR.judgments[aid][i];
  const ok = await VK.confirm({danger:true, title:`删除 ${aid} 的这条判断？`, ok:'永久删除',
    body:`<ul><li>会删掉 <b>${esc(aid)}</b> 在 ${full(j.at)} 写下的判断。</li><li>不会动：事实、其它 agent 的判断。</li><li>不能恢复。</li></ul>`});
  if(ok) await mutate('/judgments/'+enc(aid)+'/'+i, {method:'DELETE', body: JSON.stringify({expect_at: j.at||''})}, '已删');
}
async function deleteUser(){
  const s = CUR.summary;
  const ok = await VK.confirm({danger:true, title:`删除用户 ${s.uid}？`, ok:'永久删除', typed: s.uid,
    body:`<ul><li>会删掉 <code>${esc(s.product)}</code> 下这个用户的全部记忆：<b>${s.sessions} 场对话、${s.facts} 条事实、${s.judgments} 条判断、${s.reviews} 次复盘</b>。</li><li>不会动：其它产品下同名用户的记忆、agent 文件。</li><li>不能恢复；审计里只留条数。</li></ul>`});
  if(!ok) return;
  try{
    const d = await api(userPath(), {method:'DELETE', body: JSON.stringify({confirm: ok.value})});
    CUR = null; setUrlUid(''); VK.crumb('');
    $('#detail').innerHTML = `<div class="vk-alert vk-alert--ok">${icon('check')}<div>已删除：${d.deleted.sessions} 场对话、${d.deleted.facts} 条事实、${d.deleted.judgments} 条判断、${d.deleted.reviews} 次复盘。</div></div>`;
    await loadList(); toast('已删除');
  }catch(err){ toast('删除失败：'+err.message, {kind:'err'}); }
}

VK.onSearch('筛 uid', q => { QUERY = q; paintList(); });
VK.onProduct(async p => {
  PRODUCT = p; CUR = null; EDIT = null; setUrlUid(''); VK.crumb(''); VK.showList();
  $('#detail').innerHTML = '<div class="vk-empty">选一个用户。</div>';
  await loadList().catch(e => toast('打不开：'+e.message, {kind:'err'}));
});

(async () => {
  META = await api('/products');
  const cand = [VK.product(), loadLegacyProduct(), META.default];
  const want = cand.find(p => p && META.products.includes(p)) || META.products[0];
  PRODUCT = VK.setProducts(META.products.map(p => ({value:p, label: META.readonly.includes(p) ? p+' · 儿童 · 只读' : p, child: META.readonly.includes(p)})), {value: want});
  await loadList();
  let uid = null; try{ uid = new URLSearchParams(location.search).get('uid'); }catch(e){}
  if(uid && USERS.some(u => u.uid === uid)) openUser(uid);
})().catch(e => { $('#detail').innerHTML = `<div class="vk-alert vk-alert--err">${icon('alert')}<div>没加载出来：${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
