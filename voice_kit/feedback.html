<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据回流 · voice-kit 后台</title>
<link rel="stylesheet" href="/admin/static/vk-admin.css?v={{VK_ASSET_V}}">
<script src="/admin/static/vk-shell.js?v={{VK_ASSET_V}}"></script>
</head>
<body data-vk-module="feedback" data-vk-env="{{VK_ENV}}">
<div class="vk-shell" id="vkShell">
  <div class="vk-workspace" id="main" data-pane="list">
    <aside class="vk-list" aria-label="agent 列表">
      <div class="vk-list-head"><span class="vk-list-title">Agent</span><span class="hint" id="listDays"></span></div>
      <div class="vk-list-body"><div id="globalNote"></div><div id="list"><span class="vk-skel"></span><span class="vk-skel w60"></span><span class="vk-skel"></span><span class="vk-skel w40"></span></div></div>
      <div class="vk-list-foot"><p class="hint">每一轮对话在网关层记一行（原话去标识、uid 只存哈希）。系统只标问题、归纳、出提案；<b>发布由人点</b>。儿童档位的 agent 不采集。</p></div>
    </aside>
    <main class="vk-detail" id="detailScroll" tabindex="-1">
      <div class="vk-detail-in" id="detail"><div class="vk-empty">选一个 agent。</div></div>
    </main>
  </div>
</div>

<script>
VK.build();
const API = '/admin/feedback/api';
let META = null, CUR = null, DAYS = 7, FLAG = '', TURNS = [], PROP = null, AN = null, TAB = 'trend', QUERY = '', DIFFMODE = null;
const $ = s => document.querySelector(s);
const esc = VK.esc, icon = VK.icon, enc = encodeURIComponent;
const toast = (m, o) => VK.toast(m, o);
const api = VK.api(API);
const pct = v => v==null ? '—' : Math.round(v*100)+'%';
const when = s => esc(String(s||'').replace('T',' ').slice(0,16));
const badge = (t, c='') => `<span class="vk-badge ${c}">${esc(t)}</span>`;
const tag = (t, c='') => `<span class="vk-tag ${c}">${esc(t)}</span>`;
const alertBox = (kind, html) => `<div class="vk-alert vk-alert--${kind}">${icon(kind==='ok'?'check':kind==='info'?'info':kind==='child'?'shield':'alert')}<div>${html}</div></div>`;
const SEVTAG = {high:'vk-tag--hi', medium:'vk-tag--mid', low:''};
const flagTags = fs => (fs||[]).map(f => `<span class="vk-tag ${SEVTAG[f.severity]||''}" title="${esc(f.detail||'')}">${esc(f.label)}</span>`).join(' ');
const STATUS = {draft:['草稿','vk-badge--draft'], evaluated:['已评测','vk-badge--eval'], rejected:['已作废','vk-badge--rej'], published:['已发布','vk-badge--pub'], rolled_back:['已回滚','vk-badge--back']};
const statusBadge = s => { const x = STATUS[s]||[s,'']; return badge(x[0], x[1]); };
const isPending = p => ['draft','evaluated'].includes(p.status);
const bumpV = (v, part) => { const n = String(v||'0.0.0').split('.').map(x => parseInt(x,10)||0); while(n.length<3) n.push(0);
  if(part==='minor') return `${n[0]}.${n[1]+1}.0`; return `${n[0]}.${n[1]}.${n[2]+1}`; };
function setUrlId(id){ try{ const u = new URL(location.href); if(id) u.searchParams.set('id', id); else u.searchParams.delete('id'); history.replaceState(null,'',u.pathname+u.search); }catch(e){} }

// ---------------------------------------------------------------- 列表
async function loadList(){
  META = await api('/agents?days='+DAYS);
  $('#globalNote').innerHTML = META.enabled ? '' : alertBox('warn', '采集总开关是关的（<code>VOICEKIT_FEEDBACK=0</code>）：现在不会有新回合进来。');
  $('#listDays').textContent = '近 '+DAYS+' 天';
  VK.setNavCount('feedback', META.agents.reduce((s,a) => s + (a.pending||0), 0));
  VK.setProducts(PRODUCT_OPTS(), {value: VK.product(), fallback: '', persist: false, optional: true});
  paintList();
}
function PRODUCT_OPTS(){
  const prods = [...new Set(META.agents.map(a => a.product).filter(Boolean))].sort();
  return [{value:'', label:'全部产品'}, ...prods.map(p => ({value:p, label: p==='qiuqiu' ? p+' · 儿童' : p, child: p==='qiuqiu'}))];
}
function paintList(){
  const q = QUERY.toLowerCase(), prod = VK.product();
  const shown = META.agents.filter(a => (!prod || a.product === prod) && (!q || (a.id+' '+a.name).toLowerCase().includes(q)));
  $('#list').innerHTML = shown.length ? shown.map(a => {
    const hot = a.problem_rate != null && a.problem_rate > .15;
    return `<button class="vk-item" data-id="${esc(a.id)}" ${CUR&&CUR.id===a.id?'aria-current="true"':''}>
    <span class="l1"><span class="nm">${esc(a.name)}</span>${a.collect ? (a.pending?`<span class="vk-count" title="${a.pending} 个待审提案">${a.pending} 待审</span>`:'') : `<span class="vk-badge vk-badge--child">${icon('shield')}不采集</span>`}</span>
    <span class="l2"><span class="mono">v${esc(a.version)}</span>${a.collect
      ? `<span class="vk-dot-sep"></span><span>${a.n} 回合</span><span class="vk-dot-sep"></span><span class="vk-minibar ${hot?'hot':''}" aria-hidden="true"><i style="width:${Math.min(100, Math.round((a.problem_rate||0)*100))}%"></i></span><span class="${hot?'dn':''}">问题 ${pct(a.problem_rate)}</span>`
      : `<span class="vk-dot-sep"></span><span>儿童档位</span>`}</span></button>`; }).join('')
    : `<div class="vk-empty">${icon('empty')}${META.agents.length?'当前筛选下没有 agent。':'还没有 agent。'}</div>`;
  document.querySelectorAll('#list .vk-item').forEach(b => b.onclick = () => open(b.dataset.id, {focus:true}));
}

async function open(id, opt={}){
  try{
    const same = CUR && CUR.id === id;
    const d = await api('/agents/'+enc(id)+'?days='+DAYS);
    const t = d.collect ? (await api('/agents/'+enc(id)+'/turns?days='+DAYS+(FLAG?'&flag='+FLAG:''))).turns : [];
    CUR = d; TURNS = t;
    if(!same){
      AN = null; PROP = null;
      TAB = (d.proposals||[]).some(isPending) ? 'proposals' : 'trend';
    }
    if(TAB==='proposals' && d.collect){
      const ps = d.proposals||[];
      const pick = (PROP && ps.find(p => p.id === PROP.id)) || ps.find(isPending) || ps[0];
      PROP = pick ? await api(aPath()+'/proposals/'+enc(pick.id)) : null;
    }
    render(); paintList(); setUrlId(id); VK.crumb(d.name, {plain:true}); VK.showDetail();
    if(opt.focus) $('#detailScroll').focus({preventScroll:true});
  }catch(e){ toast('打不开：'+e.message, {kind:'err'}); }
}
const reopen = () => open(CUR.id);
const aPath = () => '/agents/'+enc(CUR.id);

// ---------------------------------------------------------------- 趋势图（内联 SVG）
function lineChart(title, days, series, {fmt=v=>v, max=null}={}){
  const W=320, H=120, L=34, R=6, T=8, B=20;
  const xs = days.map((_,i)=> L + (days.length<2 ? (W-L-R)/2 : i*(W-L-R)/(days.length-1)));
  const vals = series.flatMap(s=>s.data).filter(v=>v!=null);
  const top = max!=null ? max : Math.max(1, ...vals);
  const y = v => T + (H-T-B) * (1 - v/top);
  const paths = series.map(s => {
    let d='', pen=false;
    s.data.forEach((v,i)=>{ if(v==null){pen=false;return;} d += (pen?'L':'M')+xs[i].toFixed(1)+','+y(v).toFixed(1)+' '; pen=true; });
    const dots = s.data.map((v,i)=> v==null?'':`<circle cx="${xs[i].toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${s.color}"><title>${esc(days[i])} ${esc(s.name)}：${esc(fmt(v))}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="${s.dash||''}"/>${dots}`;
  }).join('');
  const lbl = [0, Math.floor((days.length-1)/2), days.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map(i=>`<text x="${xs[i]}" y="${H-5}" font-size="9" text-anchor="middle" fill="var(--vk-fg-2)">${esc(days[i].slice(5))}</text>`).join('');
  const summary = series.map(s => s.name+' '+s.data.map(v => v==null?'—':fmt(v)).join(', ')).join('；');
  return `<div class="vk-card vk-chart"><div class="kicker" style="margin-bottom:6px">${esc(title)}</div>
    <div class="vk-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}：${esc(summary)}">
      <line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="var(--vk-border-strong)"/>
      <line x1="${L}" y1="${y(top)}" x2="${W-R}" y2="${y(top)}" stroke="var(--vk-chart-grid)" stroke-dasharray="2 3"/>
      <text x="${L-4}" y="${y(top)+3}" font-size="9" text-anchor="end" fill="var(--vk-fg-2)">${esc(fmt(top))}</text>
      <text x="${L-4}" y="${y(0)+3}" font-size="9" text-anchor="end" fill="var(--vk-fg-2)">0</text>
      ${paths}${lbl}</svg></div>`;
}

function trendHtml(st){
  if(!st.n) return `<div class="vk-empty">${icon('empty')}<div>这 ${DAYS} 天没有回合。${DAYS<30?`<button class="vk-btn vk-btn--sm" data-days="30" style="margin-left:6px">看 30 天</button>`:''}</div></div>
    <p class="hint" style="max-width:var(--vk-read-max)">数据怎么来：用户在任何产品里跟这个 agent 对话（调 <code>/v1/agents/${esc(CUR.id)}/chat/completions</code>，包括 /talk 和 AI 教练），每一轮自动记一行到
    <code>agents/_feedback/${esc(CUR.id)}/turns/</code>。不需要宿主产品调 review。</p>`;
  const days = st.days.map(d=>d.day);
  const flagRows = Object.entries(st.flags).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]);
  const worst = flagRows.slice(0,3).map(([c])=>c);
  const colors = ['var(--vk-chart-3)','var(--vk-chart-1)','var(--vk-chart-2)'];
  const trunc = Object.entries(st.flag_meta).find(([c,m]) => /截断/.test(m.label));
  return `<div class="vk-grid vk-g-4">
      <div class="vk-card vk-metric"><div class="kicker">Turns · 回合</div><div class="big">${st.n}</div><div class="sub">约 ${st.sessions} 场 · ${esc(st.since)} ~ ${esc(st.until)}</div></div>
      <div class="vk-card vk-metric"><div class="kicker">Problem · 问题占比</div><div class="big ${st.problem_rate>.15?'dn':''}">${pct(st.problem_rate)}</div><div class="sub">${st.problem} 回合（只算 high / medium）</div></div>
      <div class="vk-card vk-metric"><div class="kicker">First token · 首字</div><div class="big">${st.first_p50??'—'}<small>ms</small></div><div class="sub">P50 · P90 ${st.first_p90??'—'}ms</div></div>
      <div class="vk-card vk-metric"><div class="kicker">Length · 平均字数</div><div class="big">${st.avg_chars??'—'}</div><div class="sub">上限 ${CUR.max_chars}${trunc?` · ${esc(trunc[1].label)} ${pct(st.flag_rates[trunc[0]])}`:''}</div></div>
    </div>
    <div class="vk-grid vk-g-2" style="margin-top:16px">
      ${lineChart('每天回合数', days, [{name:'回合', color:'var(--vk-chart-1)', data: st.days.map(d=>d.n)},{name:'有问题', color:'var(--vk-chart-3)', data: st.days.map(d=>d.problem)}])}
      ${lineChart('各 flag 比例（最多的三个）', days, worst.map((c,i)=>({name: st.flag_meta[c].label, color: colors[i], dash: i===2?'3 2':'', data: st.days.map(d=>d.flag_rates[c])})), {fmt: v=>Math.round(v*100)+'%'})}
      ${lineChart('首字 ms', days, [{name:'P50', color:'var(--vk-chart-1)', data: st.days.map(d=>d.first_p50)},{name:'P90', color:'var(--vk-chart-2)', dash:'3 2', data: st.days.map(d=>d.first_p90)}])}
    </div>
    <section class="vk-section"><h3>各 flag</h3><div class="vk-tw"><table class="vk-table"><thead><tr><th>flag</th><th>严重度</th><th class="r">回合</th><th class="r">比例</th><th>前半段 → 后半段</th></tr></thead><tbody>
      ${Object.entries(st.flag_meta).map(([c,m])=>`<tr><td>${esc(m.label)} <span class="mono hint">${esc(c)}</span></td><td>${tag(m.severity, SEVTAG[m.severity])}</td>
        <td class="r num">${st.flags[c]}</td><td class="r num">${pct(st.flag_rates[c])}</td><td class="mono nowrap">${pct(st.trend[c].early)} → ${pct(st.trend[c].late)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint" style="margin-top:8px">「有问题」只算 high / medium；「会话在 agent 说完后结束」「截断」是弱信号，单列不计入。</p></section>`;
}

// ---------------------------------------------------------------- 有问题的回合
function ctxHtml(t){
  const row = (who, s, cls) => s ? `<div class="vk-say ${cls}"><span class="who">${who}</span><div class="bub">${esc(s)}</div></div>` : '';
  return `<div class="vk-conv" style="margin-top:10px">${t.prev?row('上一轮 用户', t.prev.user, '')+row('上一轮 agent', t.prev.reply, 'agent'):''}
    ${row('用户', t.user, 'me')}${row('agent', t.reply+'（'+t.chars+' 字 · 首字 '+(t.first_ms??'—')+'ms）', 'agent me')}
    ${t.next?row('下一轮 用户', t.next.user, ''):'<p class="hint" style="padding-left:74px">（这一场后面没有了）</p>'}</div>`;
}
function turnsHtml(){
  const inCases = new Set((CUR.cases||[]).map(c=>c.from_turn));
  return `<div class="vk-row" style="margin-bottom:12px"><label class="hint" for="flagSel">按 flag 筛</label><select id="flagSel" class="vk-select-native"><option value="">全部有问题的</option>
      ${Object.entries(META.flags).map(([c,m])=>`<option value="${esc(c)}" ${FLAG===c?'selected':''}>${esc(m.label)}</option>`).join('')}</select>
      <span class="hint">${TURNS.length} 条（最多显示 300）</span></div>
    ${TURNS.length ? TURNS.map(t=>`<details class="vk-card vk-plain"><summary><span class="mono hint">${when(t.at)} · v${esc(t.version)}</span> ${flagTags(t.flags)}
        <span class="hint">「${esc((t.user||'').slice(0,40))}」</span></summary>
        ${ctxHtml(t)}
        <div class="vk-row" style="margin-top:10px">${inCases.has(t.id)?badge('已在用例集','vk-badge--ok'):`<button class="vk-btn vk-btn--sm" data-act="add-case" data-id="${esc(t.id)}">加入用例集</button>`}<span class="mono hint">${esc(t.id)}</span></div>
      </details>`).join('')
      : `<div class="vk-empty">${icon('empty')}${FLAG?'当前筛选下没有回合。<button class="vk-btn vk-btn--sm" data-act="clear-flag">清除筛选</button>':'这段时间没有被标出问题的回合。'}</div>`}`;
}

// ---------------------------------------------------------------- 分析
function analysesHtml(){
  const as = CUR.analyses||[];
  return `<div class="vk-row vk-desk-only" style="margin-bottom:12px"><button class="vk-btn ${AN?'':'vk-btn--primary'}" id="btnAnalyze">开始分析（近 ${DAYS} 天，调用模型）</button>
      <span class="hint grow">统计 + 让模型归纳「情况类型」。送给模型前再去标识一次；模型挂了就只给统计。</span></div>
    <div id="anOut">${AN?analysisDetail(AN):''}</div>
    ${as.length?`<section class="vk-section"><h3>分析记录</h3><div class="vk-tw"><table class="vk-table"><thead><tr><th>时间</th><th>范围</th><th>当时版本</th><th class="r">回合 / 有问题</th><th class="r">情况类型</th><th>模型</th><th><span class="vk-sr">操作</span></th></tr></thead><tbody>
      ${as.map(a=>`<tr ${AN&&AN.id===a.id?'class="editing"':''}><td class="mono nowrap">${when(a.at)}</td><td class="mono nowrap">${esc(a.since)}~${esc(a.until)}</td><td class="mono">v${esc(a.version)}</td>
        <td class="r num">${a.n} / ${a.problem}</td><td class="r num">${a.situations}</td><td>${badge(a.llm, a.llm==='ok'?'vk-badge--ok':a.llm==='degraded'?'vk-badge--err':'')}</td>
        <td class="act"><button class="vk-btn vk-btn--ghost vk-btn--sm" data-act="open-an" data-id="${esc(a.id)}">看</button></td></tr>`).join('')}</tbody></table></div></section>`
      :`<div class="vk-empty">${icon('empty')}还没分析过。</div>`}`;
}
function analysisDetail(an){
  const sits = an.situations||[];
  return `<div class="vk-card"><div class="vk-card-h"><h3>分析 <span class="mono">${esc(an.id)}</span></h3><span class="hint">${esc(an.since)}~${esc(an.until)} · ${an.stats.n} 轮 · 有问题 ${an.stats.problem}</span></div>
    ${an.llm.status!=='ok'?alertBox(an.llm.status==='degraded'?'err':'warn', `模型：${esc(an.llm.status)}。${esc(an.llm.reason||'')}${an.llm.status==='degraded'?' 下面只有统计。':''}`):''}
    ${sits.length?sits.map(s=>`<div class="vk-card" style="background:var(--vk-surface-2)"><div class="vk-row"><b>${esc(s.id)} · ${esc(s.title)}</b> ${tag(s.count+' 次')} ${(s.codes||[]).map(c=>tag((META.flags[c]||{}).label||c)).join(' ')}</div>
      <p class="hint" style="margin-top:6px">相关策略：${esc(s.related||'—')}</p><p style="margin-top:4px">建议：${esc(s.suggestion||'—')}</p>
      <details class="vk-plain"><summary>证据 ${s.evidence.length} 条</summary>${s.evidence.map(id=>an.samples[id]?`<div class="mono hint" style="margin-top:8px">${esc(id)}</div>${ctxHtml(an.samples[id])}`:'').join('')}</details></div>`).join('')
      :'<p class="hint">没有情况类型。</p>'}
    ${sits.length?`<div class="vk-row vk-desk-only" style="margin-top:12px"><button class="vk-btn vk-btn--primary" id="btnPropose" data-id="${esc(an.id)}">据此出提案（调用模型）</button><span class="hint grow">模型对 persona / method / playbook 做最小改动；松绑措辞或动身份字段 → 提案直接作废。</span></div>`:''}
  </div>`;
}

// ---------------------------------------------------------------- 提案（版式 C）
function proposalsHtml(){
  const ps = CUR.proposals||[];
  if(!ps.length) return `<div class="vk-empty">${icon('empty')}<div>还没有提案。先跑一次分析，再点「据此出提案」。</div><button class="vk-btn" data-goto="analyses">去分析</button></div>`;
  return `<div class="vk-prop">
    <div class="vk-prop-list" role="list" aria-label="提案列表">${ps.map(p => `<button class="vk-item" role="listitem" data-act="open-prop" data-id="${esc(p.id)}" ${PROP&&PROP.id===p.id?'aria-current="true"':''}>
      <span class="l1"><span class="nm mono">${esc(p.id)}</span></span>
      <span class="l2">${statusBadge(p.status)}${p.forced?badge('强制','vk-badge--warn'):''}<span class="mono">v${esc(p.base_version)}</span></span></button>`).join('')}</div>
    <div id="propOut" style="min-width:0">${PROP?propHtml(PROP):'<div class="vk-empty">选一个提案。</div>'}</div></div>`;
}
function diffRowsOf(lines){
  let on = 0, nn = 0;
  return lines.map(l => l.op===' ' ? {op:' ', o:++on, n:++nn, text:l.text} : l.op==='-' ? {op:'-', o:++on, n:'', text:l.text} : {op:'+', o:'', n:++nn, text:l.text});
}
function diffHtml(file, lines, mode){
  const rows = diffRowsOf(lines);
  const add = rows.filter(r=>r.op==='+').length, del = rows.filter(r=>r.op==='-').length;
  // 未变的连续段：改动前后各留 2 行，超过 6 行才折叠
  const keep = new Set();
  rows.forEach((r,i)=>{ if(r.op!==' ') for(let k=i-2;k<=i+2;k++) keep.add(k); });
  const segs = []; let run = [];
  rows.forEach((r,i) => { if(r.op===' ' && !keep.has(i)) run.push(r); else { if(run.length) segs.push({fold:run}); run = []; segs.push({row:r}); } });
  if(run.length) segs.push({fold:run});
  const fk = file.replace(/[^a-z0-9]/gi,'_');
  let g = 0, body = '';
  const cell = (cls, no, sg, text, extra='') => `<div class="vk-dl ${cls}" ${extra}><span class="no">${no}</span><span class="sg" aria-hidden="true">${sg}</span><span class="tx">${text===null?'':esc(text)||'&nbsp;'}</span></div>`;
  const emit = (r, extra='') => {
    if(mode==='unified') return cell(r.op==='+'?'add':r.op==='-'?'del':'', r.op==='+'?r.n:r.o, r.op==='+'?'+':r.op==='-'?'−':'', r.text, extra);
    return '';
  };
  if(mode==='unified'){
    segs.forEach(s => {
      if(s.row){ body += emit(s.row); return; }
      if(s.fold.length <= 6){ s.fold.forEach(r => body += emit(r)); return; }
      const id = fk+'-'+(g++);
      body += `<button type="button" class="vk-dl fold" data-unfold="${id}">⋯ 展开 ${s.fold.length} 行未改动</button>` + s.fold.map(r => emit(r, `hidden data-grp="${id}"`)).join('');
    });
  }else{
    // 并排：左旧右新；连续的删除块和紧跟的新增块按行配对，空位打斜纹
    const flat = [];
    segs.forEach(s => s.row ? flat.push(s.row) : flat.push({fold:s.fold}));
    for(let i=0;i<flat.length;i++){
      const it = flat[i];
      if(it.fold){
        const pair = r => cell('', r.o, '', r.text) + cell('r', r.n, '', r.text);
        if(it.fold.length <= 6){ it.fold.forEach(r => body += pair(r)); continue; }
        const id = fk+'-'+(g++);
        body += `<button type="button" class="vk-dl fold" data-unfold="${id}">⋯ 展开 ${it.fold.length} 行未改动</button>` +
          it.fold.map(r => cell('', r.o, '', r.text, `hidden data-grp="${id}"`) + cell('r', r.n, '', r.text, `hidden data-grp="${id}"`)).join('');
        continue;
      }
      if(it.op===' '){ body += cell('', it.o, '', it.text) + cell('r', it.n, '', it.text); continue; }
      const dels = [], adds = [];
      while(i<flat.length && flat[i].op==='-'){ dels.push(flat[i]); i++; }
      while(i<flat.length && flat[i].op==='+'){ adds.push(flat[i]); i++; }
      i--;
      for(let k=0;k<Math.max(dels.length, adds.length);k++){
        const d = dels[k], a = adds[k];
        body += (d ? cell('del', d.o, '−', d.text) : cell('pad', '', '', null)) + (a ? cell('add r', a.n, '+', a.text) : cell('pad r', '', '', null));
      }
    }
  }
  return `<div class="vk-diff-box"><div class="vk-diff-head"><span class="file">${esc(file)}</span><span class="stat"><span class="up">+${add}</span> <span class="dn">−${del}</span></span><span class="grow"></span>
      <div class="vk-seg" role="group" aria-label="diff 视图"><button type="button" data-mode="split" aria-pressed="${mode!=='unified'}">并排</button><button type="button" data-mode="unified" aria-pressed="${mode==='unified'}">合并</button></div></div>
    <div class="vk-diff ${mode==='unified'?'unified':''}">${mode==='unified'?'':'<div class="vk-diff-cap">旧</div><div class="vk-diff-cap r">提案</div>'}${body||'<div class="vk-dl fold">没有改动</div>'}</div></div>`;
}
function cmpRow(label, o, n, {better='up', fmt=v=>v??'—'}={}){
  let cls='', arrow='';
  if(o!=null && n!=null && o!==n){ const good = (n>o)===(better==='up'); cls = good ? 'up' : 'dn'; arrow = n>o ? '↑' : '↓'; }
  return `<tr><td>${esc(label)}</td><td class="mono r">${esc(fmt(o))}</td><td class="mono r ${cls}">${esc(fmt(n))}</td><td class="r ${cls}">${arrow||'<span class="hint">持平</span>'}</td></tr>`;
}

  const next = bumpV(CUR.version, 'minor');
  const pub = $('#btnPub');
  if(pub) pub.onclick = async () => {
    const ok = await VK.confirm({title:`发布 ${p.id} 为 v${next}？`, ok:`发布为 v${next}`,
      body:`<ul><li>会发生：<code>${esc(CUR.id)}</code> 的线上文件换成提案版，版本 v${esc(CUR.version)} → <b>v${esc(next)}</b>，写进 CHANGELOG 和审计。</li><li>不会变：用户记忆、回流里已经记下的回合。</li><li>能恢复：发布后可以回滚到 v${esc(CUR.version)} 的内容。</li></ul>`});
    if(!ok) return;
    VK.busy(pub, async () => {
      const r = await api(pp+'/publish', {method:'POST', body: '{}'}); await reopen(); toast('已发布 v'+r.published_version+commitNote(r.commit));
    }, '发布中…');
  };
  const chk = $('#forceChk'), note = $('#forceNote'), fb = $('#btnForce');
  if(chk){
    const refresh = () => { fb.disabled = !(chk.checked && note.value.trim()); };
    chk.onchange = refresh; note.oninput = refresh; refresh();
    fb.onclick = async () => {
      const ok = await VK.confirm({danger:true, title:`没达门槛也发布 ${p.id}？`, ok:`强制发布为 v${next}`, typed: p.id,
        body:`<ul><li>会发生：线上立刻换成提案版（v${esc(CUR.version)} → <b>v${esc(next)}</b>）。</li><li>没过的门槛：${p.gate.reasons.map(esc).join('；')}</li><li>理由「${esc(note.value.trim())}」原文进审计和 CHANGELOG。</li><li>能恢复：之后可以回滚。</li></ul>`});
      if(!ok) return;
      VK.busy(fb, async () => {
        const r = await api(pp+'/publish', {method:'POST', body: JSON.stringify({force:true, confirm:'我确认要发布', note: note.value})});
        await reopen(); toast('已强制发布 v'+r.published_version+commitNote(r.commit));
      }, '发布中…');
    };
  }
  const rb = $('#btnRollback');
  if(rb) rb.onclick = async () => {
    const ok = await VK.confirm({danger:true, title:`回滚 ${p.id}？`, ok:`回滚到 v${p.from_version} 的内容`,
      input:{label:'回滚原因（进审计，可不填）', placeholder:'例如：线上反馈追问变生硬'},
      body:`<ul><li>会发生：文件内容恢复到 v${esc(p.from_version)}，版本号升 patch（v${esc(CUR.version)} → v${esc(bumpV(CUR.version,'patch'))}）。</li><li>不会变：回流里已经记下的回合、用例集。</li><li>能恢复：这个提案之后可以重新走发布。</li></ul>`});
    if(!ok) return;
    VK.busy(rb, async () => {
      const r = await api(pp+'/rollback', {method:'POST', body: JSON.stringify({note: ok.value})}); await reopen(); toast('已回滚到 v'+r.rolled_back_version+commitNote(r.commit));
    }, '回滚中…');
  };
}
function commitNote(c){ if(!c) return ''; return c.ok ? ' · 已提交 '+(c.hash||'') : ' · 没能提交：'+(c.reason||''); }

VK.onSearch('搜 agent id、名字', q => { QUERY = q; if(META) paintList(); });
VK.onProduct(() => { if(META) paintList(); });

(async () => {
  await loadList();
  let want = null;
  try{ want = new URLSearchParams(location.search).get('id') || decodeURIComponent((location.hash||'').slice(1)); }catch(e){}
  const hit = want && META.agents.find(a=>a.id===want);
  if(hit){
    // 从别的页带 id 跳过来时，它不在当前产品筛选里就先放开筛选，免得详情和列表对不上
    if(VK.product() && hit.product !== VK.product()){ VK.setProducts(PRODUCT_OPTS(), {value:'', persist:false, optional:true}); paintList(); }
    open(want);
  }
})().catch(e => { $('#detail').innerHTML = alertBox('err', '没加载出来：'+esc(e.message)); });
</script>
