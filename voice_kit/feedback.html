<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据回流 · 后台</title>
<style>
:root{--bg:#F5F6F8;--paper:#fff;--ink:#1B2028;--ink2:#4B5563;--ink3:#7B8494;--line:#DCE0E6;--line2:#C5CAD3;
  --acc:#1E6B5A;--accbg:#E4F1EC;--warn:#8A5A00;--warnbg:#FBF1DA;--bad:#9B2C2C;--badbg:#FBE5E5;--mono:#EEF1F4;
  --s1:#1E6B5A;--s2:#B4531F;--s3:#5A4FE6}
@media (prefers-color-scheme:dark){:root{--bg:#13161B;--paper:#1A1E25;--ink:#E7EAF0;--ink2:#B4BAC6;--ink3:#7F8795;--line:#2A2F38;--line2:#3A414C;
  --acc:#5FBFA4;--accbg:#16302A;--warn:#E3B45B;--warnbg:#2E2412;--bad:#E38484;--badbg:#331A1A;--mono:#22272F;
  --s1:#5FBFA4;--s2:#E39A6B;--s3:#9C94FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:5px 11px;border-radius:4px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:4px;padding:5px 8px}
textarea{width:100%;min-height:40vh;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100dvh}
@media (max-width:820px){#app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
aside{border-right:1px solid var(--line);background:var(--paper);padding:18px 16px}
nav.top{display:flex;gap:4px;margin:0 0 14px;font-size:13px;flex-wrap:wrap}
nav.top a{padding:4px 10px;border-radius:4px;color:var(--ink2);text-decoration:none;border:1px solid transparent}
nav.top a.on{border-color:var(--line2);background:var(--bg);color:var(--ink);font-weight:600}
aside h1{font-size:15px;margin:0 0 8px}
.u{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid transparent;background:none;border-radius:6px;margin-bottom:4px}
.u:hover{background:var(--bg)}
.u.on{border-color:var(--line2);background:var(--bg)}
.u b{display:block;font-size:14px}
.u small{color:var(--ink3);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);margin-right:4px;white-space:nowrap}
.pill.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
main{padding:24px 32px 64px;max-width:1120px;min-width:0}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:22px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.grow{flex:1}
.hint{font-size:12px;color:var(--ink3)}
.iss{padding:8px 12px;border-left:3px solid var(--warn);background:var(--warnbg);margin:10px 0;font-size:13px}
.iss.bad{border-left-color:var(--bad);background:var(--badbg)}
.iss.ok{border-left-color:var(--acc);background:var(--accbg)}
section.blk{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
section.blk h3{margin:0 0 8px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.card{border:1px solid var(--line);background:var(--paper);padding:10px 12px;margin:8px 0}
.txt{white-space:pre-wrap}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chart{border:1px solid var(--line);background:var(--paper);padding:10px 12px}
.chart svg{width:100%;height:auto;display:block}
.legend{font-size:12px;color:var(--ink3)} .legend i{display:inline-block;width:10px;height:3px;margin:0 4px 3px 8px;vertical-align:middle}
.ctx{font-size:13px;margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.ctx div{display:grid;grid-template-columns:72px 1fr;gap:6px}
.ctx b{color:var(--ink3);font-weight:500}
.ctx .me{background:var(--mono)}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);background:var(--paper);max-height:60vh;overflow:auto}
.diff div{white-space:pre-wrap;padding:0 8px}
.diff .a{background:var(--accbg)} .diff .d{background:var(--badbg);text-decoration:line-through;text-decoration-color:var(--ink3)}
.diff .same{color:var(--ink3)}
.cmp td.up{color:var(--acc)} .cmp td.down{color:var(--bad)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;max-width:60vw}
#toast.show{opacity:1}
details summary{cursor:pointer}
</style>
</head>
<body>
<div id="app">
<aside>
  <nav class="top"><a href="/admin/agents">Agent 人设库</a><a href="/admin/memory">用户记忆</a><a href="/admin/feedback" class="on">数据回流</a></nav>
  <h1>数据回流</h1>
  <div id="globalNote"></div>
  <div id="list"><p class="hint">读取中…</p></div>
  <p class="hint" style="margin-top:18px">每一轮对话在网关层记一行（原话去标识、uid 只存哈希）。<br>
    系统只标问题、归纳、出提案；<b>发布由人点</b>。<br>儿童档位的 agent 不采集。</p>
</aside>
<main id="main"><p class="hint">选一个 agent。</p></main>
</div>
<div id="toast"></div>

<script>
const API = '/admin/feedback/api';
let META = null, CUR = null, DAYS = 7, FLAG = '', TURNS = [], PROP = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = encodeURIComponent;
const pill = (t,c='') => `<span class="pill ${c}">${esc(t)}</span>`;
const pct = v => v==null ? '—' : Math.round(v*100)+'%';
const when = s => esc(String(s||'').replace('T',' ').slice(0,16));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200); }
async function api(path, opt={}){
  const r = await fetch(API+path, {headers:{'Content-Type':'application/json'}, ...opt});
  if(!r.ok){
    let d=''; try{ d=(await r.json()).detail }catch(e){}
    if(d && typeof d==='object') d = (d.message||'')+(d.reasons?'：'+d.reasons.join('；'):'');
    throw new Error(d||('HTTP '+r.status));
  }
  return r.json();
}
const SEV = {high:'bad', medium:'warn', low:''};
const flagPills = fs => (fs||[]).map(f => `<span title="${esc(f.detail||'')}">${pill(f.label, SEV[f.severity])}</span>`).join('');
const STATUS = {draft:['草稿','warn'], evaluated:['已评测','acc'], rejected:['已作废','bad'], published:['已发布','acc'], rolled_back:['已回滚','']};

// ---------------------------------------------------------------- 列表
async function loadList(){
  META = await api('/agents?days='+DAYS);
  $('#globalNote').innerHTML = META.enabled ? '' : `<div class="iss">采集总开关是关的（VOICEKIT_FEEDBACK=0）：现在不会有新回合进来。</div>`;
  $('#list').innerHTML = META.agents.map(a => `<button class="u ${CUR&&CUR.id===a.id?'on':''}" data-id="${esc(a.id)}">
    <b>${esc(a.name)} <span class="mono hint" style="font-weight:400">v${esc(a.version)}</span></b>
    ${a.collect
      ? `<small>近 ${DAYS} 天 ${a.n} 轮 · 有问题 ${pct(a.problem_rate)}</small><br>${a.pending?pill(a.pending+' 个待审提案','warn'):''}`
      : `<small>${pill('不采集')} 儿童档位</small>`}
  </button>`).join('');
  document.querySelectorAll('.u').forEach(b => b.onclick = () => open(b.dataset.id));
}

async function open(id){
  try{
    CUR = await api('/agents/'+enc(id)+'?days='+DAYS); PROP = null;
    if(CUR.collect){ TURNS = (await api('/agents/'+enc(id)+'/turns?days='+DAYS+(FLAG?'&flag='+FLAG:''))).turns; }
    render(); loadList();
    try{ history.replaceState(null,'','#'+id); }catch(e){}
  }catch(e){ toast('打不开：'+e.message); }
}
const reopen = () => open(CUR.id);

// ---------------------------------------------------------------- 趋势图（内联 SVG）
function lineChart(title, days, series, {fmt=v=>v, max=null}={}){
  const W=320, H=120, L=34, R=6, T=8, B=20;
  const xs = days.map((_,i)=> L + (days.length<2 ? (W-L-R)/2 : i*(W-L-R)/(days.length-1)));
  const vals = series.flatMap(s=>s.data).filter(v=>v!=null);
  const top = max!=null ? max : Math.max(1, ...vals);
  const y = v => T + (H-T-B) * (1 - v/top);
  const paths = series.map(s => {
    let d='', pen=false;
    s.data.forEach((v,i)=>{ if(v==null){pen=false;return;} d += (pen?'L':'M')+xs[i].toFixed(1)+','+y(v).toFixed(1)+' '; pen=true; });
    const dots = s.data.map((v,i)=> v==null?'':`<circle cx="${xs[i].toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${s.color}"><title>${esc(days[i])} ${esc(s.name)}：${esc(fmt(v))}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6"/>${dots}`;
  }).join('');
  const lbl = [0, Math.floor((days.length-1)/2), days.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map(i=>`<text x="${xs[i]}" y="${H-5}" font-size="9" text-anchor="middle" fill="var(--ink3)">${esc(days[i].slice(5))}</text>`).join('');
  return `<div class="chart"><div class="hint">${esc(title)}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
      <line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="var(--line2)"/>
      <line x1="${L}" y1="${y(top)}" x2="${W-R}" y2="${y(top)}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <text x="${L-4}" y="${y(top)+3}" font-size="9" text-anchor="end" fill="var(--ink3)">${esc(fmt(top))}</text>
      <text x="${L-4}" y="${y(0)+3}" font-size="9" text-anchor="end" fill="var(--ink3)">0</text>
      ${paths}${lbl}</svg>
    <div class="legend">${series.map(s=>`<i style="background:${s.color}"></i>${esc(s.name)}`).join('')}</div></div>`;
}

function trendHtml(st){
  if(!st.n) return `<div class="iss">这 ${DAYS} 天没有回合。数据怎么来：用户在任何产品里跟这个 agent 对话
    （调 <code>/v1/agents/${esc(CUR.id)}/chat/completions</code>，包括 /talk 和 AI 教练），每一轮自动记一行到
    <code>agents/_feedback/${esc(CUR.id)}/turns/</code>。不需要宿主产品调 review。</div>`;
  const days = st.days.map(d=>d.day);
  const flagRows = Object.entries(st.flags).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]);
  const worst = flagRows.slice(0,3).map(([c])=>c);
  const colors = ['var(--s1)','var(--s2)','var(--s3)'];
  return `<p class="hint">${st.since} ~ ${st.until} · ${st.n} 轮 · 约 ${st.sessions} 场 · 有问题 ${st.problem}（${pct(st.problem_rate)}）
      · 平均 ${st.avg_chars??'—'} 字 · 首字 P50 ${st.first_p50??'—'}ms / P90 ${st.first_p90??'—'}ms · 字数上限 ${CUR.max_chars}</p>
    <div class="charts">
      ${lineChart('每天回合数', days, [{name:'回合', color:'var(--s1)', data: st.days.map(d=>d.n)},{name:'有问题', color:'var(--s2)', data: st.days.map(d=>d.problem)}])}
      ${lineChart('各 flag 比例（最多的三个）', days, worst.map((c,i)=>({name: st.flag_meta[c].label, color: colors[i], data: st.days.map(d=>d.flag_rates[c])})), {fmt: v=>Math.round(v*100)+'%'})}
      ${lineChart('首字 ms', days, [{name:'P50', color:'var(--s1)', data: st.days.map(d=>d.first_p50)},{name:'P90', color:'var(--s2)', data: st.days.map(d=>d.first_p90)}])}
    </div>
    <div class="tw"><table style="margin-top:10px"><tr><th>flag</th><th>严重度</th><th>回合</th><th>比例</th><th>前半段 → 后半段</th></tr>
      ${Object.entries(st.flag_meta).map(([c,m])=>`<tr><td>${esc(m.label)} <span class="mono hint">${c}</span></td><td>${pill(m.severity, SEV[m.severity])}</td>
        <td>${st.flags[c]}</td><td>${pct(st.flag_rates[c])}</td><td class="mono">${pct(st.trend[c].early)} → ${pct(st.trend[c].late)}</td></tr>`).join('')}
    </table></div>
    <p class="hint">「有问题」只算 high / medium；「会话在 agent 说完后结束」「截断」是弱信号，单列不计入。</p>`;
}

// ---------------------------------------------------------------- 有问题的回合
function ctxHtml(t){
  const row = (who, s, me) => s ? `<div class="${me?'me':''}"><b>${who}</b><span>${esc(s)}</span></div>` : '';
  return `<div class="ctx">${t.prev?row('上一轮 用户', t.prev.user)+row('上一轮 agent', t.prev.reply):''}
    ${row('用户', t.user, true)}${row('agent', t.reply+'（'+t.chars+' 字 · 首字 '+(t.first_ms??'—')+'ms）', true)}
    ${t.next?row('下一轮 用户', t.next.user):'<div><b></b><span class="hint">（这一场后面没有了）</span></div>'}</div>`;
}
function turnsHtml(){
  const inCases = new Set((CUR.cases||[]).map(c=>c.from_turn));
  return `<div class="bar"><label class="hint">按 flag 筛 <select id="flagSel"><option value="">全部有问题的</option>
      ${Object.entries(META.flags).map(([c,m])=>`<option value="${c}" ${FLAG===c?'selected':''}>${esc(m.label)}</option>`).join('')}</select></label>
      <span class="hint">${TURNS.length} 条（最多显示 300）</span></div>
    ${TURNS.length ? TURNS.map(t=>`<details class="card"><summary><span class="mono hint">${when(t.at)} · v${esc(t.version)}</span> ${flagPills(t.flags)}
        <span class="hint">「${esc((t.user||'').slice(0,40))}」</span></summary>
        ${ctxHtml(t)}
        <div class="bar">${inCases.has(t.id)?pill('已在用例集','acc'):`<button class="addCase" data-id="${esc(t.id)}">加入用例集</button>`}<span class="mono hint">${esc(t.id)}</span></div>
      </details>`).join('') : '<p class="hint">没有。</p>'}`;
}

// ---------------------------------------------------------------- 分析
function analysesHtml(){
  const as = CUR.analyses||[];
  return `<div class="bar"><button class="p" id="btnAnalyze">开始分析（近 ${DAYS} 天）</button>
      <span class="hint">统计 + 让模型归纳「情况类型」。送给模型前再去标识一次；模型挂了就只给统计。</span></div>
    <div id="anOut"></div>
    ${as.length?`<div class="tw"><table><tr><th>时间</th><th>范围</th><th>当时版本</th><th>回合 / 有问题</th><th>情况类型</th><th>模型</th><th></th></tr>
      ${as.map(a=>`<tr><td class="mono">${when(a.at)}</td><td class="mono">${esc(a.since)}~${esc(a.until)}</td><td class="mono">v${esc(a.version)}</td>
        <td>${a.n} / ${a.problem}</td><td>${a.situations}</td><td>${pill(a.llm, a.llm==='ok'?'acc':a.llm==='degraded'?'bad':'')}</td>
        <td><button class="openAn" data-id="${esc(a.id)}">看</button></td></tr>`).join('')}</table></div>`:'<p class="hint">还没分析过。</p>'}`;
}
function analysisDetail(an){
  const sits = an.situations||[];
  return `<div class="card"><div class="bar" style="margin:0"><b>分析 ${esc(an.id)}</b><span class="hint">${esc(an.since)}~${esc(an.until)} · ${an.stats.n} 轮 · 有问题 ${an.stats.problem}</span></div>
    ${an.llm.status!=='ok'?`<div class="iss ${an.llm.status==='degraded'?'bad':''}">模型：${esc(an.llm.status)}。${esc(an.llm.reason||'')}${an.llm.status==='degraded'?' 下面只有统计。':''}</div>`:''}
    ${sits.length?sits.map(s=>`<div class="card"><b>${esc(s.id)} · ${esc(s.title)}</b> ${pill(s.count+' 次')} ${(s.codes||[]).map(c=>pill((META.flags[c]||{}).label||c)).join('')}
      <div class="hint">相关策略：${esc(s.related||'—')}</div><div>建议：${esc(s.suggestion||'—')}</div>
      <details><summary class="hint">证据 ${s.evidence.length} 条</summary>${s.evidence.map(id=>an.samples[id]?`<div class="mono hint" style="margin-top:6px">${esc(id)}</div>${ctxHtml(an.samples[id])}`:'').join('')}</details></div>`).join('')
      :'<p class="hint">没有情况类型。</p>'}
    ${sits.length?`<div class="bar"><button class="p" id="btnPropose" data-id="${esc(an.id)}">据此出提案</button><span class="hint">模型对 persona / method / playbook 做最小改动；松绑措辞或动身份字段 → 提案直接作废。</span></div>`:''}
  </div>`;
}

// ---------------------------------------------------------------- 提案
function proposalsHtml(){
  const ps = CUR.proposals||[];
  return `${ps.length?`<div class="tw"><table><tr><th>时间</th><th>状态</th><th>基于</th><th>改的文件</th><th>门槛</th><th></th></tr>
    ${ps.map(p=>{ const s=STATUS[p.status]||[p.status,'']; return `<tr><td class="mono">${when(p.created_at)}</td><td>${pill(s[0],s[1])}${p.forced?pill('强制','bad'):''}</td>
      <td class="mono">v${esc(p.base_version)}${p.published_version?' → v'+esc(p.published_version):''}</td><td class="mono">${esc((p.files||[]).join(' '))}</td>
      <td>${p.gate.ok?pill('可发布','acc'):`<span class="hint">${esc(p.gate.reasons[0]||'')}</span>`}</td>
      <td><button class="openProp" data-id="${esc(p.id)}">打开</button></td></tr>`; }).join('')}</table></div>`
    :'<p class="hint">还没有提案。先在「分析」里跑一次，再点「据此出提案」。</p>'}
    <div id="propOut">${PROP?propHtml(PROP):''}</div>`;
}
function diffHtml(lines){
  // 长段相同的行折叠，只留改动前后各 2 行
  const keep = new Set();
  lines.forEach((l,i)=>{ if(l.op!==' ') for(let k=i-2;k<=i+2;k++) keep.add(k); });
  let out='', skipped=0;
  lines.forEach((l,i)=>{
    if(l.op===' ' && !keep.has(i)){ skipped++; return; }
    if(skipped){ out += `<div class="same">… ${skipped} 行没变 …</div>`; skipped=0; }
    out += `<div class="${l.op==='+'?'a':l.op==='-'?'d':'same'}">${l.op} ${esc(l.text)||'&nbsp;'}</div>`;
  });
  if(skipped) out += `<div class="same">… ${skipped} 行没变 …</div>`;
  return `<div class="diff">${out||'<div class="same">没有改动</div>'}</div>`;
}
function cmpRow(label, o, n, {better='up', fmt=v=>v??'—'}={}){
  let cls='';
  if(o!=null && n!=null && o!==n) cls = ((n>o)===(better==='up')) ? 'up' : 'down';
  return `<tr><td>${esc(label)}</td><td class="mono">${esc(fmt(o))}</td><td class="mono ${cls}">${esc(fmt(n))}</td></tr>`;
}
function evalHtml(ev){
  if(!ev) return '<p class="hint">还没评测。评测会用真实模型把旧版和提案版各跑一遍：启用的用例 + 红线套件。评测不写记忆、不写回流。</p>';
  const o=ev.old, n=ev.new;
  const rows = (o.cases.rows||[]).map((r,i)=>({o:r, n:(n.cases.rows||[])[i]||{}}));
  return `<p class="hint">评测于 ${when(ev.at)} · 用例 ${ev.n_cases} 条 · 红线套件 ${esc(ev.suite||'（这个档位没有）')}</p>
    <div class="tw"><table class="cmp"><tr><th></th><th>旧 v${esc(o.version)}</th><th>提案版</th></tr>
      ${cmpRow('用例集通过率', o.cases.pass_rate, n.cases.pass_rate, {fmt:pct})}
      ${ev.suite?cmpRow('红线套件通过率', (o.suite||{}).pass_rate, (n.suite||{}).pass_rate, {fmt:pct}):''}
      ${cmpRow('平均字数', o.avg_chars, n.avg_chars, {better:'down'})}
      ${cmpRow('平均问句数', o.avg_questions, n.avg_questions, {better:'down'})}
      ${cmpRow('首字 P50 ms', o.first_p50, n.first_p50, {better:'down'})}
      ${cmpRow('首字 P90 ms', o.first_p90, n.first_p90, {better:'down'})}
    </table></div>
    <details><summary class="hint">逐条看（${rows.length} 条用例${ev.suite?' + 红线套件':''}）</summary>
      <div class="tw"><table><tr><th>用例</th><th>旧版回复</th><th>提案版回复</th></tr>
      ${rows.map(r=>`<tr><td class="mono">${esc(r.o.id)}</td><td>${esc(r.o.reply)}<div>${(r.o.fails||[]).map(f=>pill(f,'bad')).join('')}</div></td>
        <td>${esc(r.n.reply)}<div>${(r.n.fails||[]).map(f=>pill(f,'bad')).join('')}</div></td></tr>`).join('')}
      ${ev.suite&&o.suite?o.suite.cases.map((c,i)=>{ const m=(n.suite.cases||[])[i]||{}; return `<tr><td class="mono">${esc(c.id)}</td>
        <td>${esc(c.reply)}<div>${(c.findings||[]).map(f=>pill(f,'bad')).join('')}</div></td><td>${esc(m.reply)}<div>${(m.findings||[]).map(f=>pill(f,'bad')).join('')}</div></td></tr>`; }).join(''):''}
      </table></div></details>`;
}
function propHtml(p){
  const s = STATUS[p.status]||[p.status,''];
  const editable = ['draft','evaluated'].includes(p.status);
  const sitT = Object.fromEntries((p.situations||[]).map(x=>[x.id,x.title]));
  return `<div class="card"><div class="head"><h3 style="margin:0">提案 ${esc(p.id)}</h3>${pill(s[0],s[1])}${p.forced?pill('强制发布','bad'):''}
      <span class="hint">基于 v${esc(p.base_version)} · 分析 ${esc(p.analysis_id)} · 第 ${p.rev} 版文本</span></div>
    ${(p.problems||[]).length?`<div class="iss bad">作废原因：${p.problems.map(esc).join('；')}</div>`:''}
    <h4>改了什么</h4>
    ${(p.changes||[]).length?`<ul>${p.changes.map(c=>`<li><code>${esc(c.file)}</code> ${esc(c.summary)} <span class="hint">← ${esc(c.situation)} ${esc(sitT[c.situation]||'（对不上号）')}</span></li>`).join('')}</ul>`:'<p class="hint">模型没列出改动说明。</p>'}
    ${Object.keys(p.diffs||{}).map(f=>`<h4 class="mono">${esc(f)}</h4>${diffHtml(p.diffs[f])}
      ${editable?`<details><summary class="hint">编辑这份文件的提案全文</summary><textarea class="propEdit" data-f="${esc(f)}">${esc(p.files[f].new)}</textarea></details>`:''}`).join('')}
    ${editable&&Object.keys(p.diffs||{}).length?`<div class="bar"><button id="btnSaveProp">保存编辑（要重新评测）</button></div>`:''}
    <h4>评测</h4>${evalHtml(p.evaluation)}
    ${editable?`<div class="bar"><button class="p" id="btnEval">评测：旧版 vs 提案版（打真模型，慢）</button></div>`:''}
    <h4>发布</h4>
    ${editable?(p.gate.ok
      ? `<div class="iss ok">达到发布门槛：红线套件不降、用例集不降。</div><div class="bar"><button class="p" id="btnPub">发布（升 minor 版本）</button></div>`
      : `<div class="iss">还不能发布：${p.gate.reasons.map(esc).join('；')}</div>
         <div class="bar"><button class="p" disabled>发布</button>
           <label class="hint"><input type="checkbox" id="forceChk"> 我确认要发布</label>
           <input id="forceNote" placeholder="为什么强制发布（进审计和 CHANGELOG）" style="min-width:260px">
           <button class="danger" id="btnForce" disabled>强制发布</button></div>`)
      :''}
    ${p.status==='published'?`<p class="hint">发布于 ${when(p.published_at)}：v${esc(p.from_version)} → v${esc(p.published_version)}</p>
      <div class="bar"><button class="danger" id="btnRollback">回滚到发布前（内容恢复，版本号升 patch）</button></div>`:''}
    ${p.status==='rolled_back'?`<p class="hint">回滚于 ${when(p.rolled_back_at)} → v${esc(p.rolled_back_version)}</p>`:''}
  </div>`;
}

// ---------------------------------------------------------------- 用例集 + 版本
function casesHtml(){
  const cs = CUR.cases||[];
  return `<p class="hint">从有问题的真实回合生成（上下文已去标识）。勾上的才进评测。期望：不超过 N 字、最多一个问句、不用兜底句、不漏括号动作${CUR.rails==='no_scoring'?'、不打分':''}。</p>
    ${cs.length?`<div class="tw"><table><tr><th>进评测</th><th>用户说</th><th>当时回复</th><th>问题</th><th>期望</th><th></th></tr>
      ${cs.map(c=>`<tr><td><input type="checkbox" class="caseChk" data-id="${esc(c.id)}" ${c.enabled?'checked':''}></td>
        <td>${esc(c.user)}${c.history.length?`<div class="hint">（带 ${c.history.length/2} 轮上文）</div>`:''}</td><td class="hint">${esc(c.reply_then)}</td>
        <td>${(c.codes||[]).map(x=>pill((META.flags[x]||{}).label||x)).join('')}</td>
        <td class="mono hint">${esc(Object.entries(c.expect||{}).map(([k,v])=>k+(v===true?'':'='+v)).join(' '))}</td>
        <td><button class="delCase danger" data-id="${esc(c.id)}">删</button></td></tr>`).join('')}</table></div>`
      :'<p class="hint">用例集是空的。去「有问题的回合」里点「加入用例集」。没有用例的提案过不了发布门槛。</p>'}`;
}
function versionsHtml(){
  const au = CUR.audit||[];
  return `${au.length?`<div class="tw"><table><tr><th>时间</th><th>谁</th><th>操作</th><th>提案</th><th>详情</th></tr>
      ${au.map(x=>`<tr><td class="mono">${when(x.at)}</td><td>${esc(x.actor)}</td><td>${x.action==='force_publish'?pill('强制发布','bad'):esc(x.action)}</td>
        <td class="mono">${esc(x.proposal)}</td><td class="mono hint">${esc(JSON.stringify(x.detail))}</td></tr>`).join('')}</table></div>`:'<p class="hint">回流后台还没发布过。</p>'}
    ${CUR.changelog?`<details><summary class="hint">CHANGELOG.md</summary><div class="card txt mono">${esc(CUR.changelog)}</div></details>`:''}
    <h4>git log</h4>
    ${CUR.git&&!CUR.git.auto_commit?`<div class="iss">${esc(CUR.git.reason||'没开自动提交')}</div>`:''}
    ${(CUR.history||[]).length?`<table>${CUR.history.map(h=>`<tr><td class="mono">${esc(h.hash)}</td><td class="mono">${esc(h.date)}</td><td>${esc(h.subject)}</td></tr>`).join('')}</table>`:'<p class="hint">没有提交记录。</p>'}`;
}

// ---------------------------------------------------------------- 主体
function render(){
  const a = CUR;
  if(!a.collect){
    $('#main').innerHTML = `<div class="head"><h2>${esc(a.name)}</h2><span class="mono hint">v${esc(a.version)} · ${esc(a.id)}</span>${pill('不采集')}</div>
      <div class="iss">${esc(a.why)}</div>
      <p class="hint">儿童数据不进回流是这一版的红线：不记原话、不分析、不出提案。这个 agent 的策略迭代还是走
      <a href="/admin/agents#${esc(a.id)}">Agent 人设库</a> 里人工改 + 跑 8 铁律套件。</p>`;
    return;
  }
  $('#main').innerHTML = `
  <div class="head"><h2>${esc(a.name)}</h2><span class="mono hint">v${esc(a.version)} · ${esc(a.id)} · rails ${esc(a.rails)}</span>
    <a href="/admin/agents#${esc(a.id)}" style="font-size:13px">去人设库 ↗</a><span class="grow"></span>
    <label class="hint">时间范围 <select id="daysSel">${[7,14,30].map(d=>`<option ${d===DAYS?'selected':''}>${d}</option>`).join('')}</select> 天</label></div>
  ${a.enabled?'':`<div class="iss">采集总开关是关的（VOICEKIT_FEEDBACK=0）。</div>`}
  <section class="blk"><h3>① 趋势</h3>${trendHtml(a.stats)}</section>
  <section class="blk"><h3>② 有问题的回合</h3>${turnsHtml()}</section>
  <section class="blk"><h3>③ 分析</h3>${analysesHtml()}</section>
  <section class="blk"><h3>④ 提案</h3>${proposalsHtml()}</section>
  <section class="blk"><h3>回归用例集（${(a.cases||[]).length}）</h3>${casesHtml()}</section>
  <section class="blk"><h3>⑤ 版本历史</h3>${versionsHtml()}</section>`;
  bind();
}

async function busy(btn, fn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = '进行中…';
  try{ await fn(); } catch(e){ toast('没成：'+e.message); } finally{ if(document.body.contains(btn)){ btn.disabled=false; btn.textContent=old; } }
}
const aPath = () => '/agents/'+enc(CUR.id);
async function showProp(pid){ PROP = await api(aPath()+'/proposals/'+enc(pid)); $('#propOut').innerHTML = propHtml(PROP); bindProp(); $('#propOut').scrollIntoView({behavior:'smooth'}); }
function commitNote(c){ if(!c) return ''; return c.ok ? ' · 已提交 '+(c.hash||'') : ' · ⚠ 没能提交：'+(c.reason||''); }

function bind(){
  $('#daysSel').onchange = () => { DAYS = +$('#daysSel').value; reopen(); };
  $('#flagSel').onchange = () => { FLAG = $('#flagSel').value; reopen(); };
  document.querySelectorAll('.addCase').forEach(b => b.onclick = () => busy(b, async () => {
    await api(aPath()+'/cases', {method:'POST', body: JSON.stringify({turn_ids:[b.dataset.id]})}); await reopen(); toast('已加入用例集');
  }));
  document.querySelectorAll('.caseChk').forEach(c => c.onchange = async () => {
    try{ await api(aPath()+'/cases/'+enc(c.dataset.id), {method:'PATCH', body: JSON.stringify({enabled: c.checked})}); toast(c.checked?'进评测':'不进评测'); }
    catch(e){ toast('没成：'+e.message); c.checked = !c.checked; }
  });
  document.querySelectorAll('.delCase').forEach(b => b.onclick = () => { if(confirm('从用例集删掉这条？')) busy(b, async () => {
    await api(aPath()+'/cases/'+enc(b.dataset.id), {method:'DELETE'}); await reopen();
  }); });
  $('#btnAnalyze').onclick = () => busy($('#btnAnalyze'), async () => {
    const an = await api(aPath()+'/analyze', {method:'POST', body: JSON.stringify({days: DAYS})});
    await reopen(); $('#anOut').innerHTML = analysisDetail(an); bindAn();
  });
  document.querySelectorAll('.openAn').forEach(b => b.onclick = () => busy(b, async () => {
    const an = await api(aPath()+'/analyses/'+enc(b.dataset.id)); $('#anOut').innerHTML = analysisDetail(an); bindAn();
  }));
  document.querySelectorAll('.openProp').forEach(b => b.onclick = () => busy(b, () => showProp(b.dataset.id)));
  if(PROP) bindProp();
}
function bindAn(){
  const b = $('#btnPropose'); if(!b) return;
  b.onclick = () => busy(b, async () => {
    const p = await api(aPath()+'/propose', {method:'POST', body: JSON.stringify({analysis_id: b.dataset.id})});
    await reopen(); await showProp(p.id); toast(p.status==='rejected'?'提案作废了，看原因':'提案已生成');
  });
}
function bindProp(){
  const p = PROP, pp = aPath()+'/proposals/'+enc(p.id);
  const sv = $('#btnSaveProp');
  if(sv) sv.onclick = () => busy(sv, async () => {
    const files = {}; document.querySelectorAll('.propEdit').forEach(t => files[t.dataset.f] = t.value);
    await api(pp, {method:'PUT', body: JSON.stringify({files})}); await reopen(); await showProp(p.id); toast('已保存，要重新评测');
  });
  const ev = $('#btnEval');
  if(ev) ev.onclick = () => busy(ev, async () => { await api(pp+'/evaluate', {method:'POST'}); await reopen(); await showProp(p.id); toast('评测完成'); });
  const pub = $('#btnPub');
  if(pub) pub.onclick = () => { if(confirm('发布这个提案？会写入 agent 文件并升 minor 版本。')) busy(pub, async () => {
    const r = await api(pp+'/publish', {method:'POST', body: '{}'}); await reopen(); await showProp(p.id); toast('已发布 v'+r.published_version+commitNote(r.commit));
  }); };
  const chk = $('#forceChk'), fb = $('#btnForce');
  if(chk) chk.onchange = () => { fb.disabled = !chk.checked; };
  if(fb) fb.onclick = () => { if(confirm('没达门槛也要发布？这会记进审计和 CHANGELOG。')) busy(fb, async () => {
    const r = await api(pp+'/publish', {method:'POST', body: JSON.stringify({force:true, confirm:'我确认要发布', note: $('#forceNote').value})});
    await reopen(); await showProp(p.id); toast('已强制发布 v'+r.published_version+commitNote(r.commit));
  }); };
  const rb = $('#btnRollback');
  if(rb) rb.onclick = () => { const note = prompt('回滚原因（进审计）：', ''); if(note!==null) busy(rb, async () => {
    const r = await api(pp+'/rollback', {method:'POST', body: JSON.stringify({note})}); await reopen(); await showProp(p.id); toast('已回滚到 v'+r.rolled_back_version+commitNote(r.commit));
  }); };
}

(async () => {
  await loadList();
  const want = decodeURIComponent((location.hash||'').slice(1));
  if(want && META.agents.some(a=>a.id===want)) open(want);
})().catch(e => { $('#main').innerHTML = `<div class="iss bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
