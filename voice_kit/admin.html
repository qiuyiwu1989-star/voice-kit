<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 管理 · voice-kit 后台</title>
<link rel="stylesheet" href="/admin/static/vk-admin.css?v={{VK_ASSET_V}}">
<script src="/admin/static/vk-shell.js?v={{VK_ASSET_V}}"></script>
</head>
<body data-vk-module="agents" data-vk-env="{{VK_ENV}}">
<div class="vk-shell" id="vkShell">
  <div class="vk-workspace" id="main" data-pane="list">
    <aside class="vk-list" aria-label="agent 列表">
      <div class="vk-list-head"><span class="vk-list-title">Agent 人设库</span>
        <button class="vk-btn vk-btn--sm vk-desk-only" id="btnNew" title="从模板新建一个 agent">新建</button></div>
      <div class="vk-list-body" id="list"><span class="vk-skel"></span><span class="vk-skel w60"></span><span class="vk-skel"></span><span class="vk-skel w40"></span></div>
      <div class="vk-list-foot"><p class="hint">真源在 git，这里改完记得提交。铁律不在这里改——它是 rails 档位。</p><p class="hint mono" id="root" style="margin-top:4px;overflow-wrap:anywhere"></p></div>
    </aside>
    <main class="vk-detail" id="detailScroll" tabindex="-1">
      <div class="vk-detail-in" id="detail"><div class="vk-empty">选一个 agent。</div></div>
    </main>
  </div>
</div>

<dialog id="dlgNew" class="vk-dialog" aria-labelledby="dlgNewT">
  <form method="dialog" id="formNew" class="vk-dlg">
    <h2 id="dlgNewT">新建 agent</h2>
    <p class="body">从模板生成六层文件，状态是草案。不会影响线上已有的 agent。</p>
    <div class="vk-field"><label for="nId">id（小写字母、数字、连字符）</label><input class="vk-input mono" id="nId" name="id" required pattern="[a-z][a-z0-9-]{1,40}" autocomplete="off"></div>
    <div class="vk-field"><label for="nName">名字</label><input class="vk-input" id="nName" name="name" required></div>
    <div class="vk-field"><label for="nKind">级别</label><select class="vk-select-native" id="nKind" name="kind"><option value="config">配置级（prompt + 音色 + 档位）</option><option value="code">代码级（有自己的上游和记忆）</option></select></div>
    <div class="vk-field"><label for="selRails">闸门档位</label><select class="vk-select-native" name="rails" id="selRails"></select></div>
    <div class="vk-field"><label for="nBands">受众年龄档（逗号分隔）</label><input class="vk-input" id="nBands" name="bands" value="low,mid,high"></div>
    <div class="vk-field"><label for="nProduct">所属产品</label><input class="vk-input" id="nProduct" name="product" placeholder="qiuqiu / coach"></div>
    <div class="vk-dlg-foot"><button type="button" class="vk-btn vk-btn--lg" onclick="dlgNew.close()">取消</button><button class="vk-btn vk-btn--primary vk-btn--lg" value="ok">创建草案</button></div>
  </form>
</dialog>

<script>
VK.build();
const API = '/admin/agents/api';
const LAYERS = ['manifest.yaml','persona.md','method.md','playbook.md','lens.yaml'];
const LAYER_LABEL = {'manifest.yaml':'0 身份','persona.md':'1 人格','method.md':'2 方法论','playbook.md':'3 策略','lens.yaml':'4 透镜'};
const TABS = [['overview','概览'],['files','六层文件'],['test','测试'],['try','试聊'],['history','历史']];
let DICT = null, LIST = [], CUR = null, TAB = 'overview', LAYER = 'manifest.yaml', DIRTY = {}, QUERY = '';
// 全库的壳 → agent 对照表。顶层只声明不取值——取值要 fetch，而顶层 await 会把
// 整个脚本的加载卡住（9-14 那次页面点什么都没反应就是加载期出的事）。
let LIST_SHELLS = null;

const $ = s => document.querySelector(s);
const esc = VK.esc, icon = VK.icon;
const toast = (m, o) => VK.toast(m, o);
const api = VK.api(API);
const tag = (t, c='') => `<span class="vk-tag ${c}">${esc(t)}</span>`;
const badge = (t, c='') => `<span class="vk-badge ${c}">${esc(t)}</span>`;
const statusBadge = s => s==='production'?badge('生产','vk-badge--pub'):s==='draft'?badge('草案','vk-badge--draft'):badge(s||'—');
const alertBox = (kind, html) => `<div class="vk-alert vk-alert--${kind}">${icon(kind==='ok'?'check':kind==='info'?'info':'alert')}<div>${html}</div></div>`;
function setUrlId(id){ try{ const u = new URL(location.href); if(id) u.searchParams.set('id', id); else u.searchParams.delete('id'); history.replaceState(null,'',u.pathname+u.search); }catch(e){} }

async function loadShells(){ try{ LIST_SHELLS = await api('/shells'); }catch(e){ LIST_SHELLS = null; } }

// 保存接口会带回 commit：null=没开自动提交，ok=提交了，否则告诉人为什么没提交上。
// 提交失败不等于保存失败——文件已经写下去了，只是这次改动没留痕。
function commitNote(d){
  const c = d && d.commit;
  if(!c) return '';
  if(c.ok) return c.noop ? '（内容没变，没产生提交）' : ' · 已提交 '+(c.hash||'');
  return ' · 没能提交：'+(c.reason||'');
}

// ---------------------------------------------------------------- 列表
async function loadList(){
  const d = await api('/list'); LIST = d.agents; $('#root').textContent = d.root;
  if(d.shells) LIST_SHELLS = d.shells;
  VK.setProducts(PRODUCT_OPTS(), {value: VK.product(), fallback: '', persist: false, optional: true});
  paintList();
}
function PRODUCT_OPTS(){
  const prods = [...new Set(LIST.map(a => a.product).filter(Boolean))].sort();
  return [{value:'', label:'全部产品'}, ...prods.map(p => ({value:p, label: p==='qiuqiu' ? p+' · 儿童' : p, child: p==='qiuqiu'}))];
}
function paintList(){
  const q = QUERY.toLowerCase(), prod = VK.product();
  const shown = LIST.filter(a => (!prod || a.product === prod) && (!q || (a.id+' '+a.name).toLowerCase().includes(q)));
  const groups = [['production','Production · 生产'],['draft','Draft · 草案'],['_other','其它']];
  const html = groups.map(([k,l]) => {
    const items = shown.filter(a => k==='_other' ? !['production','draft'].includes(a.status) : a.status===k);
    if(!items.length) return '';
    return `<div class="vk-group kicker">${l}</div>` + items.map(a => `<button class="vk-item" data-id="${esc(a.id)}" ${CUR&&CUR.id===a.id?'aria-current="true"':''}>
      <span class="l1"><span class="nm">${esc(a.name)}</span>${statusBadge(a.status)}</span>
      <span class="l2"><span class="mono">${esc(a.id)}</span><span class="vk-dot-sep"></span><span class="mono">v${esc(a.version)}</span>
        ${a.onboarding?`<span class="vk-dot-sep"></span><span>四关 ${a.onboarding.passed}/${a.onboarding.total}</span>`:''}
        ${a.fails?`<span class="vk-dot-sep"></span><span class="dn">${a.fails} 处不过</span>`:''}</span></button>`).join('');
  }).join('');
  $('#list').innerHTML = html || `<div class="vk-empty">${icon('empty')}${LIST.length?'当前筛选下没有 agent。':'还没有 agent。'}</div>`;
  document.querySelectorAll('#list .vk-item').forEach(b => b.onclick = () => open(b.dataset.id, {focus:true}));
}

async function open(id, opt={}){
  if(CUR && CUR.id !== id && Object.keys(DIRTY).length){
    const ok = await VK.confirm({title:'放弃未保存的修改？', ok:'放弃修改', danger:true,
      body:`<ul><li><b>${Object.keys(DIRTY).map(esc).join('、')}</b> 有没保存的改动，切走就丢了。</li><li>磁盘上的文件不会变。</li></ul>`});
    if(!ok) return;
  }
  try{
    const d = await api('/'+encodeURIComponent(id));
    if(!CUR || CUR.id !== id){ DIRTY = {}; TAB = opt.tab || 'overview'; LAYER = 'manifest.yaml'; }
    CUR = d; render(); paintList(); setUrlId(id); VK.crumb(id); VK.showDetail();
    if(opt.focus) $('#detailScroll').focus({preventScroll:true});
  }catch(e){ toast('打不开：'+e.message, {kind:'err'}); }
}

function scorecard(sc){
  const g = sc.guard, s = sc.speed, acc = sc.accuracy || {};
  const f = (v,u='') => v==null?'—':(v+u);
  // 「准」这一栏**永远不显示分数**：判断测试跑器没写，编一个数比空着更坏。
  // 它显示的是两样可核对的东西：声明了几个判断维度、有几场回顾可以人看。
  const accSub = (acc.dims||[]).length
    ? `声明 ${acc.dims.join(' / ')} · ${acc.n_recaps||0} 场回顾可看`
    : `lens.yaml 里 write.judgments 是空的 · ${acc.n_recaps||0} 场回顾可看`;
  return `<div class="vk-grid vk-g-4">
    <div class="vk-card vk-metric"><div class="kicker">Guard · 守线</div><div class="big">${g.pass_rate==null?'—':g.pass_rate+'<small>%</small>'}</div><div class="sub">${g.n?`${g.n} 条 · ${g.fail} 失败 · ${esc(g.suites.join(' / '))}`:'还没跑过套件'}</div></div>
    <div class="vk-card vk-metric"><div class="kicker">Judgment · 准</div><div class="big todo">还没做</div><div class="sub">判断测试跑器没写 · ${esc(accSub)}</div></div>
    <div class="vk-card vk-metric"><div class="kicker">Speed · 快</div><div class="big">${s.p50==null?'—':Math.round(s.p50)+'<small>ms</small>'}</div><div class="sub">P90 ${f(s.p90==null?null:Math.round(s.p90),'ms')} · 目标 2500 / 6000</div></div>
    <div class="vk-card vk-metric"><div class="kicker">Usage · 被用</div><div class="big">${sc.usage?sc.usage.sessions+'<small>场</small>':'—'}</div><div class="sub">${sc.usage?`平均 ${sc.usage.avg_user_turns} 个来回 · 真实首字 P50 ${sc.usage.p50_first_ms??'—'}ms · 最近 ${esc(sc.usage.last_at)}`:'还没有真人对话'}</div></div></div>`;
}

// ---------------------------------------------------------------- 入职四关
// 后端只给四种状态，前端一个字都不要改写。尤其是 missing：
// 「还没实现」必须长得像没做，不许因为没人拦就画成绿的（spec 014 §10 验收标准）。
const GATE_UI = {
  pass:    {cls:'acc',  mark:'✓', word:'通过'},
  fail:    {cls:'bad',  mark:'✗', word:'没过'},
  todo:    {cls:'warn', mark:'○', word:'还没跑'},
  missing: {cls:'todo', mark:'—', word:'还没做'},
};
function gatesHtml(gates){
  if(!gates || !gates.length) return '';
  const done = gates.filter(g=>g.status==='pass').length;
  return `<section class="vk-section"><h3>入职四关 <span class="hint">${done} / ${gates.length} 过</span></h3>
    <div class="vk-gates">${gates.map(g=>{
      const u = GATE_UI[g.status] || GATE_UI.missing;
      return `<div class="vk-gate ${esc(u.cls)}"><div class="st ${u.cls}"><span aria-hidden="true">${u.mark}</span>${u.word}</div>
        <div class="nm">${esc(g.name)}</div>${g.suite?`<div class="ev mono">${esc(g.suite)}</div>`:''}
        <div class="ev">${esc(g.detail||'')}${g.at?` · 上次 ${esc(g.at)}`:''}</div>
        ${g.how?`<div class="ev">怎么过：${esc(g.how)}</div>`:''}</div>`;
    }).join('')}</div>
    <p class="hint" style="margin-top:8px">「还没做」= 这一关的跑器还不存在，不是通过。别把空位当绿灯。</p></section>`;
}

// ---------------------------------------------------------------- 「准」的证据：维度 + 回顾原文
function judgmentHtml(acc){
  acc = acc || {};
  const dims = acc.dims || [], rs = acc.recaps || [];
  return `<section class="vk-section"><h3>判断证据 <span class="hint">「准」这一栏的替代品</span></h3>
    <p class="hint" style="max-width:var(--vk-read-max)">${esc(acc.why||'')}
      下面是能拿出来的两样：它<b>声明</b>按什么维度判断，和它<b>实际</b>判断出了什么。
      对着看——是在用自己的方法论，还是在说放之四海皆准的套话。这需要人看，没有分数。</p>
    <p style="margin:10px 0">声明的判断维度（lens.yaml · write.judgments）：${dims.length?dims.map(d=>`<code>${esc(d)}</code>`).join(' '):'<span class="hint">空的——它没声明自己产出什么判断。</span>'}</p>
    ${rs.length?rs.map(r=>`<div class="vk-card"><div class="hint mono">${esc(r.at||'')} · v${esc(r.version||'')} · ${esc(r.model||'')} · ${r.user_turns} 个来回</div>
      <div class="pre" style="margin-top:4px">${esc(r.review)}${r.truncated?' …（截断）':''}</div></div>`).join('')
      :'<p class="hint">还没有回顾。用户端 /talk 的「结束并回顾」跑过之后会落到这里。</p>'}
  </section>`;
}

// ---------------------------------------------------------------- 详情骨架
function render(){
  const a = CUR;
  const nDirty = Object.keys(DIRTY).length;
  $('#detail').innerHTML = `
  <div class="vk-obj-head">
    <div class="id">
      <div class="vk-obj-title"><h1>${esc(a.name)}</h1>${statusBadge(a.status)}${a.ok?badge('第一关通过','vk-badge--ok'):badge('第一关不过','vk-badge--err')}</div>
      <div class="vk-obj-meta"><span class="mono">${esc(a.id)}</span><span class="vk-dot-sep"></span><span class="mono">v${esc(a.version)}</span>
        ${tag(a.kind==='code'?'代码级':'配置级')}${a.product?tag(a.product):''}${tag(a.read_level)}${tag('rails: '+a.rails,'mono')}${tag('model: '+(a.model||(DICT&&DICT.default_model)+'（默认）'),'mono')}</div>
    </div>
    <div class="vk-obj-actions">
      <button class="vk-btn" id="btnGoTry">${icon('chat')}试聊</button>
      ${a.kind==='config'?`<a class="vk-btn vk-btn--ghost" href="/talk/${esc(a.id)}" target="_blank" rel="noopener">打开用户端 ${icon('ext')}</a>`:''}
      <a class="vk-btn vk-btn--ghost" href="/admin/feedback?id=${encodeURIComponent(a.id)}">数据回流</a>
    </div>
  </div>
  ${a.notes?`<p class="vk-notes">${esc(a.notes)}</p>`:''}
  <div class="vk-tabs" role="tablist" aria-label="agent 分区">${TABS.map(([k,l]) =>
    `<button class="vk-tab" role="tab" id="tab-${k}" aria-controls="panel" data-tab="${k}" aria-selected="${TAB===k}" tabindex="${TAB===k?0:-1}">${l}${k==='files'&&nDirty?'<span class="dirty" aria-label="有未保存改动"></span>':''}${k==='files'&&a.missing.length?`<span class="n">缺 ${a.missing.length}</span>`:''}</button>`).join('')}</div>
  <div id="panel" role="tabpanel" aria-labelledby="tab-${TAB}"></div>`;
  document.querySelectorAll('.vk-tab').forEach(t => t.onclick = () => { if(TAB!==t.dataset.tab){ TAB = t.dataset.tab; paintTabs(); renderPanel(); } });
  $('#btnGoTry').onclick = () => { TAB = 'try'; paintTabs(); renderPanel(); };
  renderPanel();
}
function paintTabs(){
  document.querySelectorAll('.vk-tab').forEach(t => { const on = t.dataset.tab===TAB; t.setAttribute('aria-selected', on); t.tabIndex = on?0:-1; });
  const ft = document.querySelector('.vk-tab[data-tab="files"]');
  if(ft){ const has = Object.keys(DIRTY).length > 0, dot = ft.querySelector('.dirty');
    if(has && !dot) ft.insertAdjacentHTML('beforeend', '<span class="dirty" aria-label="有未保存改动"></span>');
    if(!has && dot) dot.remove(); }
  $('#panel').setAttribute('aria-labelledby', 'tab-'+TAB);
}
function renderPanel(){
  const p = $('#panel'), a = CUR;
  if(TAB==='overview'){
    p.innerHTML = `${scorecard(a.scorecard)}
      ${gatesHtml(a.onboarding)}
      <section class="vk-section"><h3>静态审查</h3><div id="issues">${issuesHtml(a.issues)}</div></section>
      ${shellsHtml(a)}
      ${judgmentHtml(a.scorecard && a.scorecard.accuracy)}`;
    bindShells(); return;
  }
  if(TAB==='files'){ renderFiles(p); return; }
  if(TAB==='test'){ renderTest(p); return; }
  if(TAB==='try'){ renderTry(p); return; }
  p.innerHTML = `
    <section><h3 style="margin-bottom:10px">git 历史</h3>
      ${gitBanner(a.git)}
      ${a.history.length?`<div class="vk-tw"><table class="vk-table"><thead><tr><th>提交</th><th>时间</th><th>说明</th></tr></thead><tbody>${a.history.map(h=>`<tr><td class="mono nowrap">${esc(h.hash)}</td><td class="mono nowrap">${esc(h.date)}</td><td>${esc(h.subject)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="vk-empty">${icon('empty')}没有提交记录（未提交，或不在 git 仓库里）。</div>`}
      <div class="vk-row" style="margin-top:12px"><a class="vk-btn" href="${API}/export?agent=${encodeURIComponent(a.id)}">${icon('export')}导出这个 agent 的六层文件</a>
        <a class="vk-btn vk-btn--ghost" href="${API}/export">导出全部</a>
        <span class="hint">只打六层文件，sessions / reports / users 不进包。</span></div>
    </section>
    <section class="vk-section"><h3>真人对话 <span class="hint">${(a.sessions||[]).length} 场</span></h3>
      ${(a.sessions||[]).length?`<div class="vk-tw"><table class="vk-table"><thead><tr><th>时间</th><th>版本 / 模型</th><th class="r">来回</th><th>回顾（节选）</th></tr></thead><tbody>${a.sessions.map(s=>`<tr><td class="mono nowrap">${esc(s.at)}</td><td class="mono">${esc(s.version)} / ${esc(s.model||'')}</td><td class="r num">${s.user_turns}</td><td>${esc(s.review)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="vk-empty">${icon('empty')}还没有。用户端 /talk 结束并回顾之后会落到这里。</div>`}
    </section>`;
}

// ---------------------------------------------------------------- 壳绑定
// 一个壳被两个 agent 认领 → REP 解析 slug 时拿到哪个是随机的。
// 所以这里除了能改，还要能一眼看见全库撞没撞。真正拦住的是后端。
function shellsHtml(a){
  const mine = a.shells || [];
  const all = (LIST_SHELLS && LIST_SHELLS.bindings) || [];
  const others = all.filter(b => !b.agents.includes(a.id));
  return `<section class="vk-section"><div class="vk-card">
    <div class="vk-card-h"><h3>壳绑定</h3><span class="hint">shells</span></div>
    <p class="hint" style="max-width:var(--vk-read-max)">这个 agent 服务宿主产品（AI 教练）的哪些壳。真源是 manifest.yaml 的 <code>shells</code>，
      REP 靠它把 slug 解析成 agent。<b>保存后 AI 教练对应的壳立刻换用这个 agent</b>；一个壳只能归一个 agent，撞了会被挡下。不升版本：壳绑定是部署关系，不是人设内容。</p>
    <div class="vk-row vk-desk-only" style="margin-top:12px"><label class="vk-sr" for="shellsIn">壳（逗号或空格分隔）</label>
      <input id="shellsIn" class="vk-input mono grow" placeholder="用逗号或空格分隔，例如 founder-pitch, sarah-chen" value="${esc(mine.join(', '))}">
      <button class="vk-btn vk-btn--primary" id="btnShells">保存壳绑定</button></div>
    <p class="vk-mobile-note hint" style="margin-top:8px">当前：${mine.length?mine.map(esc).join('、'):'（无）'}。修改请在电脑上操作。</p>
    ${others.length?`<div class="vk-tw" style="margin-top:12px"><table class="vk-table"><thead><tr><th>别人已认领的壳</th><th>归谁</th></tr></thead><tbody>${others.map(b=>`<tr><td class="mono">${esc(b.shell)}</td><td>${b.agents.map(x=>esc(x)).join(' + ')} ${b.conflict?badge('撞了','vk-badge--err'):''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint" style="margin-top:8px">全库没有别的 agent 认领壳。</p>'}
  </div></section>`;
}
function bindShells(){
  const btn = $('#btnShells'); if(!btn) return;
  btn.onclick = () => VK.busy(btn, async () => {
    const raw = $('#shellsIn').value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
    const before = (CUR.shells||[]).slice(), id = CUR.id;
    CUR = await api('/'+id+'/shells', {method:'PUT', body: JSON.stringify({shells: raw})});
    const note = commitNote(CUR);
    await loadShells(); render(); paintList();
    toast('壳绑定已保存'+note, {undo:{label:'撤销', fn: async () => {
      try{ CUR = await api('/'+id+'/shells', {method:'PUT', body: JSON.stringify({shells: before})}); await loadShells(); render(); paintList(); toast('已撤销壳绑定改动'); }
      catch(e){ toast('没成：'+e.message, {kind:'err'}); }
    }}});
  }, '保存中…');
}

// ---------------------------------------------------------------- 落盘留痕
// 服务器上 agents/ 不是 git 工作副本（TASKS.md 2026-09-14 部署记录），
// 所以「历史」在线上永远是空的。这条横幅的作用是：不让人把「空」误读成「没改过」。
function gitBanner(g){
  if(!g) return '';
  if(!g.repo) return alertBox('warn', `${esc(g.reason||'agents/ 不是 git 工作副本')}
    改动只活在这台机器的磁盘上：没有历史、没法回滚，下次 rsync 部署会把它盖掉。
    先用下面的「导出」把改动带回本地提交；根治办法见 TASKS.md「后台落盘留痕」那条。`);
  if(!g.auto_commit) return alertBox('warn', esc(g.reason||''));
  return alertBox('ok', 'agents/ 是 git 工作副本，且开了自动提交：后台每次保存会顺手提交一笔。');
}

function issuesHtml(iss){
  if(!iss.length) return alertBox('ok', '静态审查：没有问题。');
  return iss.map(i => alertBox(i.severity==='fail'?'err':i.severity==='warn'?'warn':'info', `<code>${esc(i.where)}</code> ${esc(i.message)}`)).join('');
}

// ---------------------------------------------------------------- 六层文件
function renderFiles(p){
  const a = CUR;
  const sub = [...LAYERS.map(l => [l, LAYER_LABEL[l]]), ['__rails','5 铁律']];
  p.innerHTML = `<div class="vk-files">
    <div class="vk-subtabs" role="tablist" aria-orientation="vertical" aria-label="六层文件">${sub.map(([k,l]) =>
      `<button class="vk-subtab" role="tab" data-l="${k}" aria-selected="${LAYER===k}" tabindex="${LAYER===k?0:-1}">${k==='__rails'?icon('lock'):''}<span>${l}</span>${DIRTY[k]!==undefined?'<span class="dirty" aria-label="未保存"></span>':''}${a.missing.includes(k)?'<span class="miss">缺</span>':''}</button>`).join('')}</div>
    <div id="editorWrap" style="min-width:0"></div></div><div id="savebarWrap" style="display:contents"></div>`;
  p.querySelectorAll('.vk-subtab').forEach(b => b.onclick = () => { LAYER = b.dataset.l; renderFiles(p); const nb = p.querySelector(`.vk-subtab[data-l="${LAYER}"]`); if(nb) nb.focus(); });
  renderEditor($('#editorWrap'));
}
function renderEditor(ed){
  $('#savebarWrap').innerHTML = '';
  if(LAYER==='__rails'){
    const r = DICT.rails[CUR.rails];
    ed.innerHTML = `<div class="vk-alert vk-alert--ro">${icon('lock')}<div><b>只读</b>　铁律由平台闸门执行，agent 只能引用。</div></div>
      <div class="vk-card"><p>档位 <code>${esc(CUR.rails)}</code>：${esc(r?r.desc:'（不存在）')}</p>
      <p class="hint" style="margin-top:8px">改档位在 manifest 的 rails 字段，可选：${Object.keys(DICT.rails).map(k=>`<code>${esc(k)}</code>`).join(' ')}</p></div>`;
    return;
  }
  const text = DIRTY[LAYER] ?? CUR.layers[LAYER] ?? '';
  const dirty = DIRTY[LAYER] !== undefined;
  const hint = LAYER==='lens.yaml' ? `<p class="hint" style="margin-bottom:8px">字典：facts ${esc(DICT.facts.join(', '))} · signals ${esc(DICT.signals.join(', '))} · recap ${esc(DICT.recap.join(', '))} · judgments 读 own/all/none。<b>write.facts 不允许</b>（事实层 agent 中立）。</p>` : '';
  ed.innerHTML = `${hint}<div id="draftIssues" aria-live="polite"></div>
    <div class="vk-editor-head"><span class="mono" style="font-size:12.5px;font-weight:600">${esc(LAYER)}</span><span class="hint">当前 v${esc(CUR.version)}</span>${CUR.missing.includes(LAYER)?badge('文件缺失','vk-badge--warn'):''}
      <span class="grow"></span><span class="hint vk-desk-only">⌘/Ctrl+S 保存</span></div>
    <label class="vk-sr" for="ta">${esc(LAYER)} 内容</label>
    <textarea id="ta" class="vk-textarea vk-editor" spellcheck="false">${esc(text)}</textarea>
    <p class="vk-mobile-note hint" style="margin-top:8px">编辑请在电脑上操作。</p>`;
  $('#savebarWrap').innerHTML = `
    <div class="vk-savebar" id="savebar">
      <span class="msg ${dirty?'':'clean'}" id="saveMsg"><i aria-hidden="true"></i><span>${dirty?`未保存改动 · <span class="mono">${esc(LAYER)}</span>`:'没有未保存改动'}</span></span>
      <button class="vk-btn vk-btn--ghost" id="btnDiscard" ${dirty?'':'hidden'}>放弃</button>
      <button class="vk-btn" id="btnCheck">校验草稿</button>
      <label class="hint" for="bump">版本</label>
      <select id="bump" class="vk-select-native"><option value="patch">patch（措辞）</option><option value="minor">minor（策略/透镜）</option><option value="major">major（方法论）</option><option value="none">不升</option></select>
      <button class="vk-btn vk-btn--primary" id="btnSave" ${dirty?'':'disabled title="没有改动可保存"'}>保存这一层</button>
    </div>`;
  const ta = $('#ta');
  ta.oninput = () => {
    const was = DIRTY[LAYER] !== undefined;
    DIRTY[LAYER] = ta.value;
    if(!was){ paintSaveState(); paintTabs(); const sb = document.querySelector(`.vk-subtab[data-l="${LAYER}"]`); if(sb && !sb.querySelector('.dirty')) sb.querySelector('span').insertAdjacentHTML('afterend','<span class="dirty" aria-label="未保存"></span>'); }
  };
  ta.onkeydown = e => {
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); if(DIRTY[LAYER]!==undefined) $('#btnSave').click(); }
    if(e.key==='Tab' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey){
      // 编辑器里 Tab 缩进两格；Esc 之后再按 Tab 才离开（避免键盘用户被困住）
      if(ta.dataset.escaped){ delete ta.dataset.escaped; return; }
      e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); ta.oninput();
    }
    if(e.key==='Escape') ta.dataset.escaped = '1';
  };
  $('#btnDiscard').onclick = () => { delete DIRTY[LAYER]; renderFiles($('#panel')); paintTabs(); };
  $('#btnCheck').onclick = () => VK.busy($('#btnCheck'), async () => {
    const d = await api('/'+CUR.id+'/validate', {method:'POST', body: JSON.stringify({layers: DIRTY})});
    $('#draftIssues').innerHTML = issuesHtml(d.issues); toast(d.ok?'草稿通过第一关':'草稿有问题，看编辑器上方', {kind: d.ok?'ok':'info'});
  }, '校验中…');
  $('#btnSave').onclick = () => VK.busy($('#btnSave'), async () => {
    const d = await api('/'+CUR.id+'/layer/'+LAYER, {method:'PUT', body: JSON.stringify({text: DIRTY[LAYER], bump: $('#bump').value})});
    const saved = LAYER; delete DIRTY[saved]; CUR = d; await loadShells(); render(); paintList();
    toast('已写入 '+saved+' · v'+d.version+commitNote(d));
  }, '保存中…');
}
function paintSaveState(){
  const dirty = DIRTY[LAYER] !== undefined, m = $('#saveMsg'); if(!m) return;
  m.classList.toggle('clean', !dirty);
  m.querySelector('span').innerHTML = dirty ? `未保存改动 · <span class="mono">${esc(LAYER)}</span>` : '没有未保存改动';
  $('#btnDiscard').hidden = !dirty;
  const s = $('#btnSave'); s.disabled = !dirty; s.title = dirty ? '⌘/Ctrl+S' : '没有改动可保存';
}

async function runTest(){
  const btn = $('#btnTest');
  $('#testOut').innerHTML = alertBox('info', '跑着……每条都要打一次真模型。可以先去看别的标签。');
  await VK.busy(btn, async () => {

      const out = `${alertBox(d.ok?'ok':'err', `${esc(d.suite)}：${d.ok?'通过':d.n_fail+' 条失败'} · ${d.n} 条 · 首字 P50 ${d.first_token?Math.round(d.first_token.p50):'—'}ms`)}
        <div class="vk-tw"><table class="vk-table"><thead><tr><th>用例</th><th>回复</th><th>问题</th></tr></thead><tbody>${d.cases.map(c=>`<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.reply)}</td><td>${c.findings.map(esc).join('<br>')||(c.failed?'':'✓')}</td></tr>`).join('')}</tbody></table></div>`;
      CUR = await api('/'+CUR.id); render(); paintList();
      const o = $('#testOut'); if(o) o.innerHTML = out;
    }catch(e){ const o = $('#testOut'); if(o) o.innerHTML = alertBox('err', `没跑完：${esc(e.message)}`); }

}

// ---------------------------------------------------------------- 试聊：直接用六层文件对话
const CHAT = {};   // agentId -> messages
function renderTry(ed){
  const id = CUR.id; CHAT[id] = CHAT[id] || [];
  ed.innerHTML = `<div class="try">
    <div class="vk-row" style="margin-bottom:10px"><span class="hint grow">走 <code>/v1/agents/${esc(id)}/chat/completions</code>：人设从六层文件装配，铁律按 rails 档位注入。改了文件保存后，下一句就生效。</span>
      <button class="vk-btn vk-btn--ghost" id="btnPrompt" aria-expanded="false">看装配出的 prompt</button><button class="vk-btn vk-btn--ghost" id="btnReset">清空对话</button></div>
    <div id="log" class="vk-card" style="min-height:260px;max-height:52vh;overflow-y:auto" aria-live="polite"></div>
    <form id="chatForm" class="vk-row" style="margin-top:10px;flex-wrap:nowrap"><label class="vk-sr" for="msg">说一句</label><input id="msg" class="vk-input grow" placeholder="以客户的身份说一句……" autocomplete="off"><button class="vk-btn vk-btn--primary" id="btnSend">发送</button></form>
    <pre id="promptView" class="vk-card pre" style="font-size:12px;max-height:40vh;overflow:auto;margin-top:12px" hidden></pre></div>`;
  paintLog();
  $('#chatForm').onsubmit = (e) => { e.preventDefault(); send(); };
  $('#btnReset').onclick = () => { CHAT[id] = []; paintLog(); };
  $('#btnPrompt').onclick = async () => {
    const pv = $('#promptView'), b = $('#btnPrompt');
    if(!pv.hidden){ pv.hidden = true; b.setAttribute('aria-expanded','false'); return; }
    try{
      const r = await fetch('/v1/agents/'+id+'/prompt'); const d = await r.json();
      pv.textContent = (d.system_prompt||'') + '\n\n--- 输出闸门：' + (d.output_rules||[]).join('、') + '\n--- 输入接管：' + (d.input_rules||[]).join('、'); pv.hidden = false; b.setAttribute('aria-expanded','true');
    }catch(e){ toast('读不出来：'+e.message, {kind:'err'}); }
  };
  if(!VK.isMobile()) $('#msg').focus();
}
function paintLog(){
  const log = $('#log'); if(!log) return;
  const msgs = CHAT[CUR.id]||[];
  log.innerHTML = msgs.length ? `<div class="vk-conv">${msgs.map(m => `<div class="vk-say ${m.role==='user'?'':'agent'}"><span class="who">${m.role==='user'?'客户':esc(CUR.name)}</span><div class="bub">${esc(m.content)}${m.pending?' ▌':''}${m.ms?`<span class="t">${m.ms}ms 首字</span>`:''}</div></div>`).join('')}</div>`
    : '<p class="hint">还没开始。你是客户，先说一句。</p>';
  log.scrollTop = log.scrollHeight;
}
async function send(){
  const id = CUR.id, inp = $('#msg'), text = inp.value.trim(); if(!text) return;
  inp.value = ''; $('#btnSend').disabled = true;
  CHAT[id].push({role:'user', content:text});
  const bot = {role:'assistant', content:'', pending:true}; CHAT[id].push(bot); paintLog();
  const t0 = performance.now();
  try{
    const r = await fetch('/v1/agents/'+id+'/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','X-Session-ID':'try-'+id},
      body: JSON.stringify({stream:true, messages: CHAT[id].filter(m=>!m.pending).map(m=>({role:m.role, content:m.content}))})});
    if(!r.ok){ let d=''; try{ d=(await r.json()).detail }catch(e){ d='HTTP '+r.status } bot.content = '（没回上来：'+d+'）'; bot.pending=false; paintLog(); return; }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
        if(!line.startsWith('data:')) continue; const p = line.slice(5).trim(); if(p==='[DONE]') continue;
        try{ const d = JSON.parse(p).choices[0].delta.content || ''; if(d && !bot.ms) bot.ms = Math.round(performance.now()-t0); bot.content += d; }catch(e){}
        paintLog();
      }
    }
  }catch(e){ bot.content += '（中断：'+e.message+'）'; }
  finally{ bot.pending = false; paintLog(); const b = $('#btnSend'); if(b) b.disabled = false; const m = $('#msg'); if(m) m.focus(); }
}
