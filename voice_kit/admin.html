<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 人设库 · 后台</title>
<style>
:root{--bg:#F5F6F8;--paper:#fff;--ink:#1B2028;--ink2:#4B5563;--ink3:#7B8494;--line:#DCE0E6;--line2:#C5CAD3;
  --acc:#1E6B5A;--accbg:#E4F1EC;--warn:#8A5A00;--warnbg:#FBF1DA;--bad:#9B2C2C;--badbg:#FBE5E5;--mono:#EEF1F4}
@media (prefers-color-scheme:dark){:root{--bg:#13161B;--paper:#1A1E25;--ink:#E7EAF0;--ink2:#B4BAC6;--ink3:#7F8795;--line:#2A2F38;--line2:#3A414C;
  --acc:#5FBFA4;--accbg:#16302A;--warn:#E3B45B;--warnbg:#2E2412;--bad:#E38484;--badbg:#331A1A;--mono:#22272F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:4px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:4px;padding:6px 8px}
textarea{width:100%;min-height:320px;font:13px/1.55 "JetBrains Mono",ui-monospace,Menlo,monospace;background:var(--mono);resize:vertical;tab-size:2}
#app{display:grid;grid-template-columns:280px 1fr;min-height:100dvh}
@media (max-width:820px){#app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
aside{border-right:1px solid var(--line);background:var(--paper);padding:18px 16px}
aside h1{font-size:15px;margin:0 0 2px}
aside .sub{font-size:12px;color:var(--ink3);margin-bottom:14px;word-break:break-all}
.ag{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;background:none;border-radius:6px;margin-bottom:4px}
.ag:hover{background:var(--bg)}
.ag.on{border-color:var(--line2);background:var(--bg)}
.ag b{display:block;font-size:14px}
.ag small{color:var(--ink3);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);margin-right:4px;white-space:nowrap}
.pill.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
main{padding:24px 32px 64px;max-width:1080px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h2{margin:0;font-size:22px}
.head .v{font:13px ui-monospace,Menlo,monospace;color:var(--ink3)}
.notes{font-size:13px;color:var(--ink3);margin:0 0 16px}
.card4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 22px}
@media (max-width:820px){.card4{grid-template-columns:repeat(2,1fr)}}
.card4>div{background:var(--paper);border:1px solid var(--line);padding:10px 12px}
.card4 small{display:block;color:var(--ink3);font-size:11px;letter-spacing:.05em}
.card4 b{font-size:20px;font-variant-numeric:tabular-nums}
.card4 i{font-style:normal;font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink2)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--ink);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.bar .grow{flex:1}
#issues{margin:10px 0}
.iss{padding:6px 10px;border-left:3px solid var(--bad);background:var(--badbg);margin:4px 0;font-size:13px}
.iss.warn{border-left-color:var(--warn);background:var(--warnbg)}
.iss.ok{border-left-color:var(--acc);background:var(--accbg)}
.iss code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
section.blk{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
section.blk h3{margin:0 0 8px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-weight:500;font-size:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
dialog{border:1px solid var(--line2);border-radius:8px;background:var(--paper);color:var(--ink);padding:20px 22px;min-width:360px}
dialog label{display:block;font-size:12px;color:var(--ink3);margin-top:10px}
dialog input,dialog select{width:100%}
.hint{font-size:12px;color:var(--ink3)}
.log{border:1px solid var(--line);background:var(--paper);padding:12px 14px;min-height:260px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.m{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;font-size:14px}
.m b{color:var(--ink3);font-weight:500;font-size:12px;padding-top:3px}
.m span{white-space:pre-wrap}
.m.user span{color:var(--ink2)}
.m i{font-style:normal;font-size:11px;color:var(--ink3);white-space:nowrap}
#promptView{white-space:pre-wrap;font-size:12px;background:var(--mono);border:1px solid var(--line);padding:12px;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>Agent 人设库</h1>
  <div class="sub" id="root">读取中…</div>
  <div id="list"></div>
  <div style="margin-top:14px"><button id="btnNew">＋ 新建 agent</button></div>
  <p class="hint" style="margin-top:18px">真源在 git。这里改完记得提交。<br>铁律不在这里改——它是 rails 档位。</p>
</aside>
<main id="main"><p class="hint">选一个 agent。</p></main>
</div>
<div id="toast"></div>

<dialog id="dlgNew">
  <form method="dialog" id="formNew">
    <b>新建 agent</b>
    <label>id（小写字母、数字、连字符）<input name="id" required pattern="[a-z][a-z0-9-]{1,40}"></label>
    <label>名字<input name="name" required></label>
    <label>级别<select name="kind"><option value="config">配置级（prompt + 音色 + 档位）</option><option value="code">代码级（有自己的上游和记忆）</option></select></label>
    <label>闸门档位<select name="rails" id="selRails"></select></label>
    <label>受众年龄档（逗号分隔）<input name="bands" value="low,mid,high"></label>
    <label>所属产品<input name="product" placeholder="qiuqiu / coach"></label>
    <div class="bar" style="margin-top:14px;justify-content:flex-end"><button type="button" onclick="dlgNew.close()">取消</button><button class="p" value="ok">创建</button></div>
  </form>
</dialog>

<script>
const API = '/admin/agents/api';
const LAYERS = ['manifest.yaml','persona.md','method.md','playbook.md','lens.yaml'];
const LAYER_LABEL = {'manifest.yaml':'0 身份','persona.md':'1 人格','method.md':'2 方法论','playbook.md':'3 策略','lens.yaml':'4 透镜'};
let DICT = null, LIST = [], CUR = null, TAB = 'manifest.yaml', DIRTY = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
async function api(path, opt={}){
  const r = await fetch(API+path, {headers:{'Content-Type':'application/json'}, ...opt});
  if(!r.ok){ let d=''; try{d=(await r.json()).detail}catch(e){} throw new Error(d||('HTTP '+r.status)); }
  return r.json();
}
const pill = (t,c='') => `<span class="pill ${c}">${esc(t)}</span>`;
const statusPill = s => s==='production'?pill('生产中','acc'):s==='draft'?pill('草案','warn'):pill(s||'—');

async function loadList(){
  const d = await api('/list'); LIST = d.agents; $('#root').textContent = d.root;
  $('#list').innerHTML = LIST.map(a => `<button class="ag ${CUR&&CUR.id===a.id?'on':''}" data-id="${esc(a.id)}">
    <b>${esc(a.name)} <span class="mono" style="color:var(--ink3);font-weight:400">${esc(a.version)}</span></b>
    <small>${esc(a.archetype||'')} · ${esc(a.kind)} · ${esc(a.read_level)} · ${esc(a.rails)}</small><br>
    ${statusPill(a.status)} ${a.fails?pill(a.fails+' 处不过','bad'):pill('校验通过','acc')} ${a.warns?pill(a.warns+' 警告','warn'):''}
  </button>`).join('');
  document.querySelectorAll('.ag').forEach(b => b.onclick = () => open(b.dataset.id));
}

async function open(id){
  if(Object.keys(DIRTY).length && !confirm('有未保存的修改，放弃？')) return;
  DIRTY = {}; CUR = await api('/'+id); TAB = 'manifest.yaml'; render(); loadList();
}

function scorecard(sc){
  const g = sc.guard, s = sc.speed;
  const f = (v,u='') => v==null?'—':(v+u);
  return `<div class="card4">
    <div><small>守线</small><b>${g.pass_rate==null?'—':g.pass_rate+'%'}</b><i>${g.n?`${g.n} 条 · ${g.fail} 失败 · ${g.suites.join(' / ')}`:'还没跑过套件'}</i></div>
    <div><small>准</small><b>—</b><i>判断测试未接</i></div>
    <div><small>快</small><b>${f(s.p50==null?null:Math.round(s.p50),'ms')}</b><i>P90 ${f(s.p90==null?null:Math.round(s.p90),'ms')} · 目标 2500 / 6000</i></div>
    <div><small>被用</small><b>${sc.usage?sc.usage.sessions+' 场':'—'}</b><i>${sc.usage?`平均 ${sc.usage.avg_user_turns} 个来回 · 真实首字 P50 ${sc.usage.p50_first_ms??'—'}ms · 最近 ${sc.usage.last_at}`:'还没有真人对话'}</i></div></div>`;
}

function render(){
  const a = CUR;
  $('#main').innerHTML = `
  <div class="head"><h2>${esc(a.name)}</h2><span class="v">v${esc(a.version)} · ${esc(a.id)}</span>
    ${statusPill(a.status)} ${pill(a.kind==='code'?'代码级':'配置级')} ${pill(a.read_level)} ${pill('rails: '+a.rails)} ${pill('model: '+(a.model||DICT.default_model+'（默认）'))}
    ${a.ok?pill('第一关通过','acc'):pill('第一关不过','bad')}
    ${a.kind==='config'?`<a href="/talk/${esc(a.id)}" target="_blank" style="font-size:13px">打开用户端 ↗</a>`:''}</div>
  <p class="notes">${esc(a.notes||'')}</p>
  ${scorecard(a.scorecard)}
  <div class="tabs">${LAYERS.map(l => `<button data-l="${l}" class="${TAB===l?'on':''}">${LAYER_LABEL[l]}${DIRTY[l]?' •':''}${a.missing.includes(l)?' ⚠':''}</button>`).join('')}
    <button data-l="__rails" class="${TAB==='__rails'?'on':''}">5 铁律（只读）</button>
    <button data-l="__try" class="${TAB==='__try'?'on':''}" style="margin-left:auto">💬 试聊</button></div>
  <div id="editor"></div>
  <div id="issues">${issuesHtml(a.issues)}</div>
  <section class="blk"><h3>跑一套用例</h3>
    <div class="bar"><select id="suite"><option value="gate_contract">gate_contract · 闸门契约</option><option value="qiuqiu_8rules">qiuqiu_8rules · 8 铁律</option><option value="coach_no_scoring">coach_no_scoring · 不打分</option><option value="listener_describe_only">listener_describe_only · 听众只描述</option></select>
      <input id="svc" placeholder="服务地址" value="${location.origin}" style="min-width:260px"><input id="key" type="password" placeholder="该 agent 所属租户的钥匙" style="min-width:200px">
      <button class="p" id="btnTest">跑（打真模型，慢）</button></div>
    <div id="testOut"></div>
    ${a.reports.length?`<table><tr><th>时间</th><th>套件</th><th>版本</th><th>结果</th><th>首字 P50 / P90</th></tr>${a.reports.map(r=>`<tr><td class="mono">${esc(r.at)}</td><td>${esc(r.suite)}</td><td class="mono">${esc(r.version)}</td><td>${r.ok?pill('通过','acc'):pill(r.n_fail+' 条失败','bad')}</td><td class="mono">${r.first_token?Math.round(r.first_token.p50)+' / '+Math.round(r.first_token.p90):'—'}</td></tr>`).join('')}</table>`:'<p class="hint">还没有报告。</p>'}
  </section>
  <section class="blk"><h3>真人对话（${(a.sessions||[]).length}）</h3>
    ${(a.sessions||[]).length?`<table><tr><th>时间</th><th>版本 / 模型</th><th>来回</th><th>回顾（节选）</th></tr>${a.sessions.map(s=>`<tr><td class="mono">${esc(s.at)}</td><td class="mono">${esc(s.version)} / ${esc(s.model||'')}</td><td>${s.user_turns}</td><td style="max-width:36em">${esc(s.review)}</td></tr>`).join('')}</table>`:'<p class="hint">还没有。用户端 /talk 结束并回顾之后会落到这里。</p>'}
  </section>
  <section class="blk"><h3>历史（git log）</h3>
    ${a.history.length?`<table>${a.history.map(h=>`<tr><td class="mono">${esc(h.hash)}</td><td class="mono">${esc(h.date)}</td><td>${esc(h.subject)}</td></tr>`).join('')}</table>`:'<p class="hint">没有提交记录（未提交，或不在 git 仓库里）。</p>'}
  </section>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { TAB=b.dataset.l; render(); });
  renderEditor();
  $('#btnTest').onclick = runTest;
}

function issuesHtml(iss){
  if(!iss.length) return `<div class="iss ok">静态审查：没有问题。</div>`;
  return iss.map(i => `<div class="iss ${i.severity}"><code>${esc(i.where)}</code> ${esc(i.message)}</div>`).join('');
}

function renderEditor(){
  const ed = $('#editor');
  if(TAB==='__try'){ renderTry(ed); return; }
  if(TAB==='__rails'){
    const r = DICT.rails[CUR.rails];
    ed.innerHTML = `<p>档位 <b>${esc(CUR.rails)}</b>：${esc(r?r.desc:'（不存在）')}</p><p class="hint">铁律由平台闸门执行，agent 只能引用。改档位在 manifest 的 rails 字段，可选：${Object.keys(DICT.rails).map(k=>`<code>${k}</code>`).join(' ')}</p>`;
    return;
  }
  const text = DIRTY[TAB] ?? CUR.layers[TAB] ?? '';
  const hint = TAB==='lens.yaml' ? `<p class="hint">字典：facts ${DICT.facts.join(', ')} · signals ${DICT.signals.join(', ')} · recap ${DICT.recap.join(', ')} · judgments 读 own/all/none。<b>write.facts 不允许</b>（事实层 agent 中立）。</p>` : '';
  ed.innerHTML = `${hint}<textarea id="ta" spellcheck="false">${esc(text)}</textarea>
  <div class="bar"><button id="btnCheck">校验草稿</button><span class="grow"></span>
    <label class="hint">版本 <select id="bump"><option value="patch">patch（措辞）</option><option value="minor">minor（策略/透镜）</option><option value="major">major（方法论）</option><option value="none">不升</option></select></label>
    <button class="p" id="btnSave" ${DIRTY[TAB]===undefined?'disabled':''}>保存这一层</button></div>`;
  const ta = $('#ta');
  ta.oninput = () => { DIRTY[TAB] = ta.value; $('#btnSave').disabled = false; };
  $('#btnCheck').onclick = async () => {
    const d = await api('/'+CUR.id+'/validate', {method:'POST', body: JSON.stringify({layers: DIRTY})});
    $('#issues').innerHTML = issuesHtml(d.issues); toast(d.ok?'草稿通过第一关':'草稿有问题');
  };
  $('#btnSave').onclick = async () => {
    try{
      const d = await api('/'+CUR.id+'/layer/'+TAB, {method:'PUT', body: JSON.stringify({text: DIRTY[TAB], bump: $('#bump').value})});
      delete DIRTY[TAB]; CUR = d; render(); loadList(); toast('已写入 '+TAB+' · v'+d.version);
    }catch(e){ toast('保存失败：'+e.message); }
  };
}

async function runTest(){
  const btn = $('#btnTest'); btn.disabled = true; $('#testOut').innerHTML = '<p class="hint">跑着……每条都要打一次真模型。</p>';
  try{
    const d = await api('/'+CUR.id+'/test', {method:'POST', body: JSON.stringify({suite:$('#suite').value, service:$('#svc').value, key:$('#key').value})});
    $('#testOut').innerHTML = `<div class="iss ${d.ok?'ok':''}">${esc(d.suite)}：${d.ok?'通过':d.n_fail+' 条失败'} · ${d.n} 条 · 首字 P50 ${d.first_token?Math.round(d.first_token.p50):'—'}ms</div>
      <table><tr><th>用例</th><th>回复</th><th>问题</th></tr>${d.cases.map(c=>`<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.reply)}</td><td>${c.findings.map(esc).join('<br>')||(c.failed?'':'✓')}</td></tr>`).join('')}</table>`;
    CUR = await api('/'+CUR.id); render(); loadList();
  }catch(e){ $('#testOut').innerHTML = `<div class="iss">跑失败：${esc(e.message)}</div>`; }
  finally{ btn.disabled = false; }
}

// ---------------------------------------------------------------- 试聊：直接用六层文件对话
const CHAT = {};   // agentId -> messages
function renderTry(ed){
  const id = CUR.id; CHAT[id] = CHAT[id] || [];
  ed.innerHTML = `<div class="try">
    <div class="bar"><span class="hint">走 <code>/v1/agents/${esc(id)}/chat/completions</code>：人设从六层文件装配，铁律按 rails 档位注入。改了文件保存后，下一句就生效。</span>
      <span class="grow"></span><button id="btnPrompt">看装配出的 prompt</button><button id="btnReset">清空对话</button></div>
    <div id="log" class="log"></div>
    <form id="chatForm" class="bar"><input id="msg" class="grow" placeholder="以客户的身份说一句……" autocomplete="off"><button class="p" id="btnSend">发送</button></form>
    <pre id="promptView" hidden></pre></div>`;
  paintLog();
  $('#chatForm').onsubmit = (e) => { e.preventDefault(); send(); };
  $('#btnReset').onclick = () => { CHAT[id] = []; paintLog(); };
  $('#btnPrompt').onclick = async () => {
    const pv = $('#promptView');
    if(!pv.hidden){ pv.hidden = true; return; }
    const r = await fetch('/v1/agents/'+id+'/prompt'); const d = await r.json();
    pv.textContent = (d.system_prompt||'') + '\n\n--- 输出闸门：' + (d.output_rules||[]).join('、') + '\n--- 输入接管：' + (d.input_rules||[]).join('、'); pv.hidden = false;
  };
  $('#msg').focus();
}
function paintLog(){
  const log = $('#log'); if(!log) return;
  log.innerHTML = (CHAT[CUR.id]||[]).map(m => `<div class="m ${m.role}"><b>${m.role==='user'?'客户':esc(CUR.name)}</b><span>${esc(m.content)}${m.pending?' ▌':''}</span>${m.ms?`<i>${m.ms}ms 首字</i>`:''}</div>`).join('') || '<p class="hint">还没开始。你是客户，先说一句。</p>';
  log.scrollTop = log.scrollHeight;
}
async function send(){
  const id = CUR.id, inp = $('#msg'), text = inp.value.trim(); if(!text) return;
  inp.value = ''; $('#btnSend').disabled = true;
  CHAT[id].push({role:'user', content:text});
  const bot = {role:'assistant', content:'', pending:true}; CHAT[id].push(bot); paintLog();
  const t0 = performance.now();
  try{
    const r = await fetch('/v1/agents/'+id+'/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','X-Session-ID':'try-'+id},
      body: JSON.stringify({stream:true, messages: CHAT[id].filter(m=>!m.pending).map(m=>({role:m.role, content:m.content}))})});
    if(!r.ok){ let d=''; try{ d=(await r.json()).detail }catch(e){ d='HTTP '+r.status } bot.content = '⚠ '+d; bot.pending=false; paintLog(); return; }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
        if(!line.startsWith('data:')) continue; const p = line.slice(5).trim(); if(p==='[DONE]') continue;
        try{ const d = JSON.parse(p).choices[0].delta.content || ''; if(d && !bot.ms) bot.ms = Math.round(performance.now()-t0); bot.content += d; }catch(e){}
        paintLog();
      }
    }
  }catch(e){ bot.content += ' ⚠ '+e.message; }
  finally{ bot.pending = false; paintLog(); $('#btnSend').disabled = false; $('#msg').focus(); }
}

$('#btnNew').onclick = () => { $('#selRails').innerHTML = Object.entries(DICT.rails).map(([k,v])=>`<option value="${k}">${k} · ${esc(v.desc)}</option>`).join(''); dlgNew.showModal(); };
$('#formNew').onsubmit = async (e) => {
  if(e.submitter && e.submitter.value!=='ok') return;
  const f = new FormData(e.target); const b = Object.fromEntries(f.entries()); b.bands = b.bands.split(',').map(s=>s.trim()).filter(Boolean);
  try{ CUR = await api('/new', {method:'POST', body: JSON.stringify(b)}); DIRTY={}; TAB='manifest.yaml'; render(); loadList(); toast('已创建 '+b.id); }
  catch(err){ toast('创建失败：'+err.message); e.preventDefault(); }
};

(async () => { DICT = await api('/dict'); await loadList(); })().catch(e => { $('#main').innerHTML = `<div class="iss">${esc(e.message)}</div>`; });
</script>
</body>
